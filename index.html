<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0a1d15">
<title>Benedetto Dal Signore Entourage 26/27 — Prepara la tua asta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =========================================================
   FantAsta 26/27 — design system
   Ispirato al tabellone di uno stadio in notturna:
   verde campo profondo, luci allo stadio, cartellini.
   ========================================================= */

:root {
  --bg: #0a1d15;
  --bg-2: #0e2419;
  --panel: #123326;
  --panel-2: #163b2b;
  --line: rgba(242,245,241,0.09);
  --line-strong: rgba(242,245,241,0.16);
  --ink: #f2f5f1;
  --ink-dim: #a9c2b3;
  --ink-faint: #6f8a7c;
  --turf: #2e8b57;
  --turf-bright: #3fae6e;
  --gold: #e3b341;
  --gold-ink: #2a2107;
  --card-yellow: #f2c230;
  --card-red: #d64545;
  --bench: #5b6b63;
  --radius-card: 14px;
  --radius-chip: 999px;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'Inter', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(120% 90% at 50% -10%, #0f2a1e 0%, var(--bg) 55%, #071409 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: calc(78px + var(--safe-bottom));
}

::selection { background: var(--gold); color: var(--gold-ink); }

input, select, button { font-family: inherit; }

/* subtle pitch-line texture behind everything */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 78px, rgba(242,245,241,0.018) 78px 79px),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(242,245,241,0.018) 78px 79px);
}

/* ---------- header ---------- */

.top-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: linear-gradient(180deg, #0a1d15 0%, rgba(10,29,21,0.94) 80%, rgba(10,29,21,0.7) 100%);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; flex: none;
  border-radius: 50%;
  background: conic-gradient(from 200deg, var(--turf), var(--turf-bright), var(--turf));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 2px rgba(242,245,241,0.15) inset, 0 2px 8px rgba(0,0,0,0.4);
}
.brand-mark svg { width: 18px; height: 18px; color: var(--ink); }
.brand-word {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.01em;
  line-height: 1.15;
  white-space: nowrap;
}
.brand-sub { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; letter-spacing: 0.02em; font-family: var(--font-display); }
.brand-sub b { color: var(--gold); font-weight: 700; }

.header-stat {
  font-family: var(--font-display);
  text-align: right;
  line-height: 1.05;
}
.header-stat b { display: block; font-size: 17px; color: var(--gold); }
.header-stat span { font-size: 9.5px; color: var(--ink-dim); font-family: var(--font-body); letter-spacing: 0.02em; }

/* ---------- main content ---------- */

#app {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 16px 24px;
}

.tab-head h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 26px;
  margin: 4px 0 2px;
  letter-spacing: 0.01em;
}
.tab-sub { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 16px; line-height: 1.4; }

.section-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 22px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

/* ---------- segmented role control ---------- */

.seg-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.seg-row::-webkit-scrollbar { display: none; }

.seg-btn {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 9px 14px;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.seg-btn.active {
  background: var(--turf);
  border-color: var(--turf-bright);
  color: #ffffff;
}
.seg-count {
  font-size: 10.5px;
  background: rgba(0,0,0,0.22);
  border-radius: 999px;
  padding: 1px 6px;
}
.seg-btn.active .seg-count { background: rgba(255,255,255,0.22); }

/* ---------- filter bar ---------- */

.filter-bar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.filter-bar input[type="search"],
.filter-bar select,
.budget-row input {
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 14px;
  width: 100%;
}
.filter-bar input[type="search"]::placeholder { color: var(--ink-faint); }
.filter-row-2 { display: flex; gap: 8px; align-items: center; }
.filter-row-2 select { flex: 1; min-width: 0; }
.switch-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--ink-dim);
  white-space: nowrap;
}

/* ---------- tier chips ---------- */

.tier-chip-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
.tier-chip-row::-webkit-scrollbar { display: none; }
.chip-filter {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 7px 12px;
  border-radius: var(--radius-chip);
  font-size: 12.5px;
  font-weight: 600;
}
.chip-filter.active { color: var(--bg); }
.chip-filter.tier-top.active { background: var(--gold); border-color: var(--gold); }
.chip-filter.tier-buono.active { background: var(--turf-bright); border-color: var(--turf-bright); color: #fff; }
.chip-filter.tier-scommessa.active { background: var(--card-yellow); border-color: var(--card-yellow); }
.chip-filter.tier-ultime.active { background: var(--bench); border-color: var(--bench); color: #fff; }
.chip-filter:not(.tier-top):not(.tier-buono):not(.tier-scommessa):not(.tier-ultime).active {
  background: var(--ink); color: var(--bg);
}

/* ---------- tier sections ---------- */

.tier-section { margin-bottom: 20px; }
.tier-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  padding: 8px 2px;
  border-bottom: 2px solid var(--line-strong);
}
.tier-head.tier-top { color: var(--gold); border-bottom-color: var(--gold); }
.tier-head.tier-buono { color: var(--turf-bright); border-bottom-color: var(--turf-bright); }
.tier-head.tier-scommessa { color: var(--card-yellow); border-bottom-color: var(--card-yellow); }
.tier-head.tier-ultime { color: var(--bench); border-bottom-color: var(--bench); }
.tier-count { font-size: 12px; color: var(--ink-dim); font-family: var(--font-body); }
.tier-desc { font-size: 12px; color: var(--ink-dim); margin: 6px 2px 10px; }

.tier-dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 5px;
}
.tier-dot.tier-top { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.tier-dot.tier-buono { background: var(--turf-bright); }
.tier-dot.tier-scommessa { background: var(--card-yellow); }
.tier-dot.tier-ultime { background: var(--bench); }

/* ---------- player cards ---------- */

.p-list, .p-list-inner { display: flex; flex-direction: column; gap: 8px; }

.p-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 12px 13px;
}
.p-card.is-mine { border-color: var(--turf-bright); box-shadow: 0 0 0 1px var(--turf-bright) inset; }
.p-card.is-other { opacity: 0.45; }

.p-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.p-card-id { display: flex; gap: 9px; align-items: flex-start; min-width: 0; }
.p-name { font-weight: 600; font-size: 15px; line-height: 1.25; }
.p-team { font-size: 12px; color: var(--ink-dim); }

.p-price { text-align: right; flex: none; }
.p-fvm { font-family: var(--font-display); font-size: 19px; color: var(--gold); line-height: 1; }
.p-fvm i { display: block; font-style: normal; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.04em; }
.p-qta { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }

.role-pill {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 6px;
  flex: none;
  margin-top: 1px;
  letter-spacing: 0.02em;
}
.role-P { background: rgba(227,179,65,0.18); color: var(--gold); }
.role-D { background: rgba(63,174,110,0.18); color: var(--turf-bright); }
.role-C { background: rgba(90,169,230,0.18); color: #7cc0ee; }
.role-A { background: rgba(214,69,69,0.18); color: #ef8686; }

.p-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-chip);
}
.chip-rig { background: rgba(227,179,65,0.16); color: var(--gold); }
.chip-piaz { background: rgba(90,169,230,0.16); color: #7cc0ee; }
.ic-mini { width: 12px; height: 12px; }

/* rigorista designato n.1: evidenziazione forte, distinta dagli altri incaricati */
.chip-rig-primary {
  background: linear-gradient(135deg, var(--gold), #f7d477);
  color: var(--gold-ink);
  box-shadow: 0 0 0 1px rgba(227,179,65,0.5), 0 2px 6px rgba(227,179,65,0.35);
}
.p-card.is-rig-primary {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold) inset;
  background: linear-gradient(180deg, rgba(227,179,65,0.08), var(--panel) 55%);
}

.p-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line-strong);
}
.stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 26px; }
.stat b { font-family: var(--font-display); font-size: 14.5px; line-height: 1.1; }
.stat i { font-style: normal; font-size: 9.5px; color: var(--ink-faint); letter-spacing: 0.03em; margin-top: 1px; }
.stat.hl b { color: var(--turf-bright); }
.stat-new { font-size: 12px; color: var(--ink-faint); font-style: italic; align-self: center; }

.p-status-btn {
  margin-top: 10px;
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  color: var(--ink-dim);
  border-radius: 9px;
  padding: 9px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.p-card.is-mine .p-status-btn { color: var(--turf-bright); border-color: var(--turf-bright); }
.p-card.is-other .p-status-btn { color: var(--card-red); border-color: var(--card-red); }
.ic { width: 15px; height: 15px; }

.empty-state {
  text-align: center;
  color: var(--ink-faint);
  padding: 40px 16px;
  font-size: 14px;
}

/* ---------- budget card (asta live) ---------- */

.budget-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 14px;
  margin-bottom: 16px;
}
.budget-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.budget-row label { font-size: 13px; color: var(--ink-dim); }
.budget-row input { width: 90px; text-align: right; }
.budget-bar-wrap { margin-bottom: 14px; }
.budget-bar { height: 10px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.budget-bar-fill { height: 100%; background: linear-gradient(90deg, var(--turf), var(--gold)); border-radius: 999px; transition: width 0.4s ease; }
.budget-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
.budget-legend b { color: var(--ink); font-family: var(--font-display); }

.budget-role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.budget-role { display: flex; align-items: center; gap: 8px; background: var(--bg-2); border-radius: 9px; padding: 8px 10px; }
.budget-role-nums { display: flex; flex-direction: column; font-size: 12px; }
.budget-role-nums .dim { color: var(--ink-faint); font-size: 10.5px; }

.rosa-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: start;
}
@media (max-width: 380px) {
  .rosa-columns { grid-template-columns: 1fr; }
}
.rosa-col-title {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--ink-dim);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------- season toggle (Statistiche tab) ---------- */

.season-toggle-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.season-toggle-btn {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 11px;
  padding: 10px 12px;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.season-toggle-btn.active { background: var(--turf); border-color: var(--turf-bright); color: #fff; }
.season-toggle-sub {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-dim);
  letter-spacing: 0.01em;
}
.season-toggle-btn.active .season-toggle-sub { color: rgba(255,255,255,0.75); }

/* ---------- season blocks inside a listone card (25/26 vs 26/27 ben divisi) ---------- */

.season-block {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--line-strong);
}
.season-block:first-of-type { margin-top: 10px; }
.season-label {
  font-family: var(--font-display);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.season-block-curr .season-label { color: var(--turf-bright); }
.season-live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--turf-bright);
  box-shadow: 0 0 5px var(--turf-bright);
  flex: none;
}
.season-empty { font-size: 11.5px; color: var(--ink-faint); font-style: italic; }

.mini-role-head {
  font-family: var(--font-display);
  font-size: 13.5px;
  color: var(--ink-dim);
  margin: 12px 0 6px;
  display: flex; gap: 8px; align-items: center;
}
.mini-role-head:first-child { margin-top: 0; }
.mini-role-head span { font-size: 11px; color: var(--ink-faint); }

.roster-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 9px;
  margin-bottom: 6px;
}
.roster-info { flex: 1; min-width: 0; }
.roster-info .p-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster-info .p-team { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster-price { font-family: var(--font-display); font-size: 12px; color: var(--gold); flex: none; }
.roster-remove { background: none; border: none; color: var(--ink-faint); padding: 4px; flex: none; }
.roster-row .role-pill { font-size: 10px; padding: 2px 5px; }

/* ---------- gestione squadre (setup) ---------- */

.teams-setup-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 12px; }
.team-setup-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 8px 9px;
}
.team-setup-row.is-mine { border-color: var(--gold); background: rgba(227,179,65,0.08); }
.team-star-btn {
  background: none; border: none; font-size: 18px; line-height: 1;
  color: var(--ink-faint); padding: 4px; flex: none;
}
.team-star-btn.active { color: var(--gold); }
.team-name-input {
  flex: 1; min-width: 0;
  background: transparent; border: none; border-bottom: 1px solid var(--line-strong);
  color: var(--ink); font-size: 14px; padding: 4px 2px;
}
.team-name-input:focus { outline: none; border-bottom-color: var(--turf-bright); }
.team-remove-btn { background: none; border: none; color: var(--ink-faint); padding: 4px; flex: none; }

.btn-secondary {
  width: 100%;
  background: var(--bg-2);
  border: 1px dashed var(--line-strong);
  color: var(--ink-dim);
  padding: 10px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 13.5px;
  margin-top: 4px;
}

/* ---------- riepilogo crediti per squadra ---------- */

.budget-overview-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.team-budget-row {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 11px; padding: 10px 12px;
}
.team-budget-row.is-mine { border-color: var(--gold); background: linear-gradient(180deg, rgba(227,179,65,0.07), var(--panel) 60%); }
.team-budget-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; }
.team-budget-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-budget-nums { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; }
.team-budget-nums b { color: var(--ink); font-family: var(--font-display); font-size: 13px; }

.empty-state-mini { font-size: 12.5px; color: var(--ink-faint); padding: 10px 2px; text-align: center; }

/* ---------- team picker (bottom sheet) ---------- */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(6,16,11,0.72);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end;
}
.sheet {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(20px + var(--safe-bottom));
  max-height: 80vh;
  overflow-y: auto;
}
.sheet-handle { width: 36px; height: 4px; background: var(--line-strong); border-radius: 999px; margin: 4px auto 14px; }
.sheet-title { font-family: var(--font-display); font-size: 17px; margin-bottom: 2px; }
.sheet-title b { color: var(--gold); }
.sheet-sub { font-size: 12px; color: var(--ink-dim); margin-bottom: 14px; }
.sheet-teams { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.sheet-team-btn {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-2); border: 1px solid var(--line-strong);
  border-radius: 11px; padding: 12px 14px;
  color: var(--ink); text-align: left;
}
.sheet-team-btn.is-mine { border-color: var(--gold); background: rgba(227,179,65,0.09); }
.sheet-team-btn.is-current { box-shadow: 0 0 0 2px var(--turf-bright) inset; }
.sheet-team-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; }
.sheet-team-budget { font-size: 11.5px; color: var(--ink-dim); flex: none; margin-left: 10px; }
.sheet-free-btn {
  width: 100%; background: rgba(214,69,69,0.12); border: 1px solid var(--card-red);
  color: var(--card-red); padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px; margin-bottom: 8px;
}
.sheet-cancel-btn {
  width: 100%; background: none; border: 1px solid var(--line-strong);
  color: var(--ink-dim); padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
}

.mark-btn {
  border-radius: 8px; border: 1px solid var(--line-strong);
  padding: 7px 10px; font-size: 12.5px; font-weight: 600;
  background: var(--bg-2); color: var(--ink-dim);
}
.mark-mine { color: var(--turf-bright); border-color: var(--turf-bright); }
.mark-other { color: var(--card-red); border-color: var(--card-red); width: 100%; }

/* ---------- export tab ---------- */

.export-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 16px;
  margin-bottom: 12px;
}
.export-card-title { font-family: var(--font-display); font-size: 16.5px; margin-bottom: 6px; }
.export-card-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.45; margin: 0 0 12px; }
.btn-primary {
  background: var(--turf);
  border: 1px solid var(--turf-bright);
  color: #fff;
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  width: 100%;
}
.btn-primary:active { background: var(--turf-bright); }
.export-note { font-size: 11.5px; color: var(--ink-faint); text-align: center; margin-top: 18px; line-height: 1.5; }

/* ---------- bottom nav ---------- */

.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: rgba(10,29,21,0.92);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + var(--safe-bottom));
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-dim);
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 6px;
  margin: 0 3px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-display);
  letter-spacing: 0.01em;
  border-radius: 12px;
}
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn.active { color: var(--bg); background: linear-gradient(135deg, var(--gold), #f0c463); }

/* ---------- sub-navigation (within a section) ---------- */

.subnav-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
}
.subnav-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-dim);
  padding: 10px 8px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-body);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.subnav-btn.active { background: var(--turf); color: #fff; }
.subnav-btn svg { width: 16px; height: 16px; }

/* ---------- collapsible mega-section (Listone) ---------- */

.mega-section { margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; background: var(--panel); }
.mega-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel-2);
  border: none;
  color: var(--ink);
  padding: 13px 14px;
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 600;
}
.mega-head .mega-sub { font-size: 11px; color: var(--ink-dim); font-family: var(--font-body); font-weight: 500; display: block; margin-top: 2px; }
.mega-head .chev { width: 16px; height: 16px; transition: transform 0.2s ease; flex: none; }
.mega-section.collapsed .chev { transform: rotate(-90deg); }
.mega-body { padding: 12px; }
.mega-section.collapsed .mega-body { display: none; }

/* ---------- griglia portieri (coppie consigliate) ---------- */

.pair-section-label {
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 600;
  margin: 14px 0 8px;
  letter-spacing: 0.02em;
}
.pair-section-label.pair-section-good { color: var(--turf-bright); }
.pair-section-label.pair-section-bad { color: var(--card-red); }
.pair-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.pair-card {
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px 12px;
}
.pair-card.pair-good { border-left-color: var(--turf-bright); }
.pair-card.pair-bad { border-left-color: var(--card-red); }
.pair-teams {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
}
.pair-keepers { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
.pair-keeper { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
.pair-keeper .p-name { font-size: 12.5px; }
.pair-keeper .p-team { font-size: 10.5px; }
.pair-keeper-missing { font-size: 11.5px; color: var(--ink-faint); font-style: italic; }
.pair-note { font-size: 11px; color: var(--ink-dim); margin: 8px 0 0; }

/* ---------- responsive ---------- */

@media (min-width: 480px) {
  .p-stats { gap: 16px; }
}

@media (min-width: 720px) {
  .top-header, #app { max-width: 720px; }
}
</style>

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state = Object.assign({}, state, saved);
    }
  } catch (e) { /* ignore corrupt storage */ }
  if (!state.teams || !state.teams.length) state.teams = [{ id: uid(), name: 'La mia squadra', isMine: true }];
  if (!state.teams.some(t => t.isMine)) state.teams[0].isMine = true;
  if (!state.astaTeamFilter) state.astaTeamFilter = getMyTeam().id;
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      budgetTotal: state.budgetTotal,
      teams: state.teams,
      assignments: state.assignments,
    }));
  } catch (e) { /* storage full or unavailable */ }
}

/* ---------- helpers ---------- */

function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function fmt0(n) { return Math.round(n).toString(); }

function playerSetpieceBadges(p) {
  const badges = [];
  if (p.rig_ord === 1) badges.push({ type: 'rig-primary', text: 'Rigorista designato' });
  else if (p.rig_ord) badges.push({ type: 'rig', text: p.rig_ord + '° rigorista' });
  if (p.piaz_ord) badges.push({ type: 'piaz', text: p.piaz_ord === 1 ? '1° piazzati' : (p.piaz_ord + '° piazzati') });
  return badges;
}

/* ---------- gestione squadre di lega ---------- */

function getMyTeam() {
  return state.teams.find(t => t.isMine) || state.teams[0];
}
function getTeam(teamId) {
  return state.teams.find(t => t.id === teamId);
}
function addTeam(name) {
  const team = { id: uid(), name: name && name.trim() ? name.trim() : ('Squadra ' + (state.teams.length + 1)), isMine: false };
  state.teams.push(team);
  saveState();
  return team;
}
function renameTeam(teamId, name) {
  const t = getTeam(teamId);
  if (t && name && name.trim()) { t.name = name.trim(); saveState(); }
}
function setMyTeam(teamId) {
  state.teams.forEach(t => t.isMine = (t.id === teamId));
  saveState();
}
function removeTeam(teamId) {
  const t = getTeam(teamId);
  if (!t || t.isMine || state.teams.length <= 1) return false;
  Object.keys(state.assignments).forEach(pid => {
    if (state.assignments[pid].teamId === teamId) delete state.assignments[pid];
  });
  state.teams = state.teams.filter(x => x.id !== teamId);
  if (state.astaTeamFilter === teamId) state.astaTeamFilter = getMyTeam().id;
  saveState();
  return true;
}

function assignPlayer(playerId, teamId, price) {
  state.assignments[playerId] = { teamId, price: Math.max(0, Math.round(price) || 0) };
  saveState();
}
function unassignPlayer(playerId) {
  delete state.assignments[playerId];
  saveState();
}
function assignmentFor(playerId) {
  return state.assignments[String(playerId)] || state.assignments[playerId] || null;
}

function teamSpent(teamId) {
  let spent = 0;
  for (const pid in state.assignments) {
    if (state.assignments[pid].teamId === teamId) spent += state.assignments[pid].price || 0;
  }
  return spent;
}
function teamRosterCount(teamId) {
  let n = 0;
  for (const pid in state.assignments) if (state.assignments[pid].teamId === teamId) n++;
  return n;
}
function teamRoster(teamId) {
  const out = [];
  for (const pid in state.assignments) {
    const a = state.assignments[pid];
    if (a.teamId !== teamId) continue;
    const p = PLAYERS_CURRENT.find(pl => String(pl.id) === String(pid));
    if (p) out.push({ player: p, price: a.price });
  }
  return out;
}

function budgetSpent() {
  return teamSpent(getMyTeam().id);
}

function budgetByRoleSpent() {
  const out = { P: 0, D: 0, C: 0, A: 0 };
  teamRoster(getMyTeam().id).forEach(({ player, price }) => { out[player.r] = (out[player.r] || 0) + price; });
  return out;
}

/* ---------- filtering & sorting ---------- */

function filterListone() {
  let list = PLAYERS_CURRENT.filter(p => p.r === state.listoneRole);
  if (state.listoneTier !== 'all') list = list.filter(p => p.tier === state.listoneTier);
  if (state.listoneSearch.trim()) {
    const q = state.listoneSearch.trim().toLowerCase();
    list = list.filter(p => p.nome.toLowerCase().includes(q) || p.squadra.toLowerCase().includes(q));
  }
  if (state.listoneHideTaken) {
    list = list.filter(p => !assignmentFor(p.id));
  }
  const sortKey = state.listoneSort;
  list = list.slice().sort((a, b) => {
    if (sortKey === 'fvm') return b.fvm - a.fvm;
    if (sortKey === 'qta') return b.qta - a.qta;
    if (sortKey === 'fm') return (b.prev ? b.prev.fm : -1) - (a.prev ? a.prev.fm : -1);
    if (sortKey === 'pv') return (b.prev ? b.prev.pv : -1) - (a.prev ? a.prev.pv : -1);
    if (sortKey === 'gf') return (b.prev ? b.prev.gf : -1) - (a.prev ? a.prev.gf : -1);
    if (sortKey === 'ass') return (b.prev ? b.prev.ass : -1) - (a.prev ? a.prev.ass : -1);
    return b.score - a.score;
  });
  return list;
}

function seasonStatsList(season) {
  return season === '2627' ? STATS_ALL_2627 : STATS_ALL_2526;
}

function filterStats() {
  let list = seasonStatsList(state.statsSeason).slice();
  if (state.statsRole !== 'all') list = list.filter(p => p.r === state.statsRole);
  if (state.statsTeam !== 'all') list = list.filter(p => p.squadra === state.statsTeam);
  if (state.statsSearch.trim()) {
    const q = state.statsSearch.trim().toLowerCase();
    list = list.filter(p => p.nome.toLowerCase().includes(q) || p.squadra.toLowerCase().includes(q));
  }
  const sortKey = state.statsSort;
  list = list.sort((a, b) => {
    if (sortKey === 'fm') return b.fm - a.fm;
    if (sortKey === 'mv') return b.mv - a.mv;
    if (sortKey === 'pv') return b.pv - a.pv;
    if (sortKey === 'gf') return b.gf - a.gf;
    if (sortKey === 'ass') return b.ass - a.ass;
    if (sortKey === 'amm') return b.amm - a.amm;
    return b.fm - a.fm;
  });
  return list;
}

/* ---------- rendering: incremental batches for perf ---------- */

function makeIncrementalRenderer(container, items, renderItem, batchSize) {
  container.innerHTML = '';
  let idx = 0;
  function renderMore() {
    const frag = document.createDocumentFragment();
    const end = Math.min(idx + batchSize, items.length);
    for (; idx < end; idx++) frag.appendChild(renderItem(items[idx]));
    container.appendChild(frag);
  }
  renderMore();
  return renderMore;
}

function renderListoneList() {
  const container = document.getElementById('listone-list');

  }

    currentRenderMore = makeIncrementalRenderer(container, list, playerCardListone, 40);
    attachInfiniteScroll(container);
  } else {
    // due mega-sezioni comprimibili invece di quattro fasce impilate: meno scroll iniziale.
    container.innerHTML = '';
    const clusters = [
      { key: 'consigliati', label: 'Titolari consigliati', tiers: ['top', 'buono'], defaultOpen: true },
      { key: 'rischio', label: 'Scommesse e fondo lista', tiers: ['scommessa', 'ultime'], defaultOpen: false },

    clusters.forEach(cluster => {
      const clusterPlayers = list.filter(p => cluster.tiers.includes(p.tier));

      const mega = el('div', 'mega-section' + (cluster.defaultOpen ? '' : ' collapsed'));
      const head = el('button', 'mega-head', `
        <span>${cluster.label}<span class="mega-sub">${cluster.tiers.map(t => TIER_META[t].short).join(' · ')}</span></span>

        </span>
      `);
      head.addEventListener('click', () => mega.classList.toggle('collapsed'));
      const body = el('div', 'mega-body');
      cluster.tiers.forEach(t => {
        const sub = clusterPlayers.filter(p => p.tier === t);
        if (!sub.length) return;
        const section = el('div', 'tier-section');
        section.innerHTML = `<div class="tier-head ${TIER_META[t].cls}">
          <span>${TIER_META[t].label}</span><span class="tier-count">${sub.length}</span>
        </div>

        section.appendChild(listWrap);
        body.appendChild(section);
      });
      mega.appendChild(head);
      mega.appendChild(body);
      container.appendChild(mega);
    });
  }
}

/* ---------- infinite scroll ---------- */

function attachInfiniteScroll(container) {
  const onScroll = debounce(() => {
    const rect = container.getBoundingClientRect();
    if (rect.bottom < window.innerHeight + 600 && currentRenderMore) currentRenderMore();
  }, 100);
  window.addEventListener('scroll', onScroll);
}

/* ---------- utils ---------- */

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}
/* =========================================================
   Team picker — bottom sheet per assegnare un giocatore
   a una delle squadre della lega (la tua o un'avversaria).
   ========================================================= */

function closeSheet() {
  const existing = document.getElementById('team-sheet-backdrop');
  if (existing) existing.remove();
}

function openTeamPicker(player, onDone) {
  closeSheet();
  const current = assignmentFor(player.id);
  const myTeam = getMyTeam();
  const ordered = [myTeam, ...state.teams.filter(t => t.id !== myTeam.id)];

  const backdrop = el('div', 'sheet-backdrop');
  backdrop.id = 'team-sheet-backdrop';

  const teamRows = ordered.map(t => {
    const spent = teamSpent(t.id);
    const remaining = state.budgetTotal - spent;
    const isCurrent = current && current.teamId === t.id;
    return `
      <button class="sheet-team-btn ${t.isMine ? 'is-mine' : ''} ${isCurrent ? 'is-current' : ''}" data-team-id="${t.id}">
        <span class="sheet-team-name">${t.isMine ? '★ ' : ''}${escapeAttr(t.name)}</span>
        <span class="sheet-team-budget">${remaining} cr. rimasti${isCurrent ? ' · attuale' : ''}</span>
      </button>`;
  }).join('');

  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Assegna <b>${player.nome}</b></div>
      <div class="sheet-sub">${player.squadra} · FVM ${fmt0(player.fvm)} · Qt.A ${fmt0(player.qta)}</div>
      <div class="sheet-teams">${teamRows}</div>
      ${current ? `<button class="sheet-free-btn" id="sheet-free-btn">Libera giocatore</button>` : ''}
      <button class="sheet-cancel-btn" id="sheet-cancel-btn">Annulla</button>
    </div>
  `;

  document.body.appendChild(backdrop);

  backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) closeSheet(); });
  document.getElementById('sheet-cancel-btn').addEventListener('click', closeSheet);
  const freeBtn = document.getElementById('sheet-free-btn');
  if (freeBtn) freeBtn.addEventListener('click', () => {
    unassignPlayer(player.id);
    closeSheet();
    if (onDone) onDone();
  });

  backdrop.querySelectorAll('.sheet-team-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const teamId = btn.dataset.teamId;
      const suggested = current && current.teamId === teamId ? current.price : Math.max(1, Math.round(player.qta));
      const raw = window.prompt('Quanti crediti per ' + player.nome + '?', String(suggested));
      if (raw === null) return;
      const price = parseInt(raw, 10);
      assignPlayer(player.id, teamId, isNaN(price) ? 0 : price);
      closeSheet();
      if (onDone) onDone();
    });
  });
}

function renderAstaSearchResults() {
  const container = document.getElementById('asta-search-results');
  const q = state.astaSearch.trim().toLowerCase();
  if (!q) { container.innerHTML = `<div class="empty-state-mini">Scrivi un nome per iniziare ad assegnare.</div>`; return; }
  const list = PLAYERS_CURRENT.filter(p => p.nome.toLowerCase().includes(q) || p.squadra.toLowerCase().includes(q)).slice(0, 15);
  container.innerHTML = '';
  if (!list.length) { container.innerHTML = `<div class="empty-state-mini">Nessun giocatore trovato.</div>`; return; }
  list.forEach(p => container.appendChild(astaSearchCard(p)));

function astaSearchCard(p) {
  const assignment = assignmentFor(p.id);
  const assignedTeam = assignment ? getTeam(assignment.teamId) : null;
  const card = el('div', 'p-card asta-search-card' + (assignedTeam ? (assignedTeam.isMine ? ' is-mine' : ' is-other') : ''));
  card.innerHTML = `
    <div class="p-card-top">
      <div class="p-card-id">
        <span class="role-pill role-${p.r}">${ROLE_META[p.r].short}</span>
        <div><div class="p-name">${p.nome}</div><div class="p-team">${p.squadra} · FVM ${fmt0(p.fvm)}</div></div>
      </div>
    </div>
    <button class="p-status-btn" data-id="${p.id}">
      <span>${assignedTeam ? (assignedTeam.isMine ? 'Tua: ' : '') + assignedTeam.name + ' · ' + assignment.price + ' cr.' : 'Assegna a…'}</span>
    </button>
  `;
  card.querySelector('.p-status-btn').addEventListener('click', () => {
    openTeamPicker(p, () => {
      renderAstaSearchResults();
      renderBudgetOverview();
      renderTeamRosterView();
    });
  });
  return card;
}

/* ---------- rose per squadra ---------- */

function renderRosterTeamChips() {
  const container = document.getElementById('roster-team-chips');
  if (!container) return;
  container.innerHTML = '';
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];
  ordered.forEach(t => {
    const btn = el('button', 'seg-btn' + (state.astaTeamFilter === t.id ? ' active' : ''),
      `${t.isMine ? '★ ' : ''}${t.name}<span class="seg-count">${teamRosterCount(t.id)}</span>`);
    btn.addEventListener('click', () => {
      state.astaTeamFilter = t.id;
      renderRosterTeamChips();
      renderTeamRosterView();
    });
    container.appendChild(btn);
  });
}

function renderTeamRosterView() {
  renderRosterTeamChips();
  const container = document.getElementById('team-roster-view');
  if (!container) return;
  const teamId = state.astaTeamFilter;
  const roster = teamRoster(teamId);
  if (!roster.length) {
    container.innerHTML = `<div class="empty-state">Nessun giocatore ancora assegnato a questa squadra.</div>`;
    return;
  }
  container.innerHTML = '';
  ['P','D','C','A'].forEach(r => {
    const rolePlayers = roster.filter(x => x.player.r === r);
    if (!rolePlayers.length) return;
    const head = el('div', 'mini-role-head', `${ROLE_META[r].label} <span>${rolePlayers.length}</span>`);
    container.appendChild(head);
    rolePlayers.forEach(({ player, price }) => container.appendChild(rosterRow(player, price)));
  });
}

function rosterRow(p, price) {
  const row = el('div', 'roster-row');
  row.innerHTML = `
    <span class="role-pill role-${p.r}">${ROLE_META[p.r].short}</span>
    <div class="roster-info"><div class="p-name">${p.nome}</div><div class="p-team">${p.squadra}</div></div>
    <span class="roster-price">${price} cr.</span>
    <button class="roster-remove" data-id="${p.id}" aria-label="Rimuovi">
      <svg viewBox="0 0 24 24" class="ic-mini"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    </button>
  `;
  row.querySelector('.roster-remove').addEventListener('click', () => {
    unassignPlayer(p.id);
    renderBudgetOverview();
    renderTeamRosterView();
    renderAstaSearchResults();
  });
  return row;
}
/* =========================================================
   Benedetto Dal Signore Entourage 26/27 — Esportazione PDF
   ========================================================= */

const APP_NAME = 'Benedetto Dal Signore Entourage 26/27';
const PDF_PREFIX = 'BDS_Entourage_2627';

function setpieceText(p) {
  const parts = [];
  if (p.rig_ord) parts.push('Rig.' + p.rig_ord);
  if (p.piaz_ord) parts.push('Piaz.' + p.piaz_ord);
  return parts.join(' / ') || '-';
}

function highlightSetpieceCell(data) {
  const raw = String(data.cell.raw || '');
  if (raw.indexOf('Rig.1') !== -1) {
    data.cell.styles.fillColor = [227, 179, 65];
    data.cell.styles.textColor = [30, 30, 30];
    data.cell.styles.fontStyle = 'bold';
  } else if (raw.indexOf('Rig.') !== -1) {
    data.cell.styles.fillColor = [245, 232, 195];
    data.cell.styles.textColor = [60, 50, 20];
  } else if (raw.indexOf('Piaz.') !== -1) {
    data.cell.styles.fillColor = [214, 232, 246];
    data.cell.styles.textColor = [20, 40, 60];
  }
}

function renderExportTab() {
  viewEl().innerHTML = exportTemplate();
  wireExportControls();
}

function exportTemplate() {
  return `
    <div class="tab-head">
      <h1>Esporta PDF</h1>
      <p class="tab-sub">Portati il tuo cheat-sheet all'asta, anche offline.</p>
    </div>

    <div class="export-card">
      <div class="export-card-title">Listone completo per reparto</div>
      <p class="export-card-desc">Tutti i giocatori del listone 26/27, divisi per ruolo e per fascia (Top, Buon giocatore, Scommessa, Ultime risorse). Le statistiche 2025/26 e 2026/27 sono in due gruppi di colonne ben separati. I rigoristi designati sono evidenziati in oro.</p>
      <button class="btn-primary" id="export-listone-btn">Genera PDF listone</button>
    </div>

    <div class="export-card">
      <div class="export-card-title">Rose della lega</div>
      <p class="export-card-desc">Un capitolo per ogni squadra della lega (la tua e tutte le avversarie), con prezzo pagato, budget residuo e fantamedia di entrambe le stagioni.</p>
      <button class="btn-primary" id="export-rosa-btn">Genera PDF rose</button>
    </div>

    <div class="export-card">
      <div class="export-card-title">Statistiche filtrate</div>
      <p class="export-card-desc">Esporta la stagione e i filtri che hai impostato nella vista Statistiche (2025/26 oppure 2026/27 in corso).</p>
      <button class="btn-primary" id="export-stats-btn">Genera PDF statistiche</button>
    </div>

    <p class="export-note">Il PDF viene generato sul telefono e scaricato direttamente: nessun dato lascia il tuo dispositivo.</p>
  `;
}

function wireExportControls() {
  document.getElementById('export-listone-btn').addEventListener('click', exportListonePDF);
  document.getElementById('export-rosa-btn').addEventListener('click', exportRosaPDF);
  document.getElementById('export-stats-btn').addEventListener('click', exportStatsPDF);
}

function pdfHeader(doc, title, subtitle) {
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(11, 31, 23);
  doc.rect(0, 0, pageWidth, 28, 'F');
  doc.setTextColor(227, 179, 65);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(title, 14, 15);
  doc.setTextColor(230, 236, 232);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.text(subtitle, 14, 22);
  doc.setTextColor(20, 20, 20);
}

function tierRGB(tier) {
  switch (tier) {
    case 'top': return [227, 179, 65];
    case 'buono': return [46, 139, 87];
    case 'scommessa': return [242, 194, 48];
    case 'ultime': return [120, 130, 124];
    default: return [200, 200, 200];
  }
}

function exportListonePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  let first = true;

  ['P', 'D', 'C', 'A'].forEach(role => {
    const players = PLAYERS_CURRENT.filter(p => p.r === role).sort((a, b) => {
      const ta = TIER_ORDER.indexOf(a.tier), tb = TIER_ORDER.indexOf(b.tier);
      if (ta !== tb) return ta - tb;
      return b.fvm - a.fvm;
    });
    if (!players.length) return;
    if (!first) doc.addPage();
    first = false;
    pdfHeader(doc, 'Listone ' + ROLE_META[role].label, APP_NAME + ' — generato il ' + new Date().toLocaleDateString('it-IT') + ' — dati 2025/26 e 2026/27 tenuti ben distinti');

    const body = players.map(p => {
      const prev = p.prev;
      const curr = p.curr && p.curr.pv > 0 ? p.curr : null;
      return [
        p.nome, p.squadra, TIER_META[p.tier].short,
        fmt0(p.fvm), fmt0(p.qta),
        prev ? fmt0(prev.pv) : '-', prev ? fmt1(prev.mv) : '-', prev ? fmt1(prev.fm) : '-',
        prev ? fmt0(prev.gf) : '-', prev ? fmt0(prev.ass) : '-',
        curr ? fmt0(curr.pv) : '-', curr ? fmt1(curr.mv) : '-', curr ? fmt1(curr.fm) : '-',
        curr ? fmt0(curr.gf) : '-', curr ? fmt0(curr.ass) : '-',
        setpieceText(p)
      ];
    });

    doc.autoTable({
      startY: 33,
      head: [
        [
          { content: 'Nome', rowSpan: 2 }, { content: 'Squadra', rowSpan: 2 }, { content: 'Fascia', rowSpan: 2 },
          { content: 'FVM', rowSpan: 2 }, { content: 'Qt.A', rowSpan: 2 },
          { content: 'Stagione 2025/26 (annata completa)', colSpan: 5, styles: { halign: 'center', fillColor: [22, 59, 43] } },
          { content: 'Stagione 2026/27 (in corso, ' + META.max_pv_2627 + 'ᵃ giornata)', colSpan: 5, styles: { halign: 'center', fillColor: [24, 68, 50] } },
          { content: 'Palla ferma', rowSpan: 2 },
        ],
        ['PG', 'MV', 'FM', 'Gol', 'Ass', 'PG', 'MV', 'FM', 'Gol', 'Ass'],
      ],
      body,
      styles: { fontSize: 7.2, cellPadding: 1.3 },
      headStyles: { fillColor: [18, 51, 38], textColor: [240, 245, 241] },
      didParseCell: (data) => {
        if (data.section !== 'body') return;
        if (data.column.index === 2) {
          const tierKey = Object.keys(TIER_META).find(k => TIER_META[k].short === data.cell.raw);
          if (tierKey) {
            const rgb = tierRGB(tierKey);
            data.cell.styles.fillColor = rgb;
            data.cell.styles.textColor = tierKey === 'scommessa' || tierKey === 'top' ? [30,30,30] : [255,255,255];
            data.cell.styles.fontStyle = 'bold';
          }
        }
        // colonne 10-14 = stagione 26/27 in corso: leggero tint per separarle a colpo d'occhio
        if (data.column.index >= 10 && data.column.index <= 14) {
          data.cell.styles.fillColor = data.cell.styles.fillColor || [234, 244, 238];
        }
        if (data.column.index === 15) highlightSetpieceCell(data);
      },
      margin: { top: 33 },
    });
  });

  doc.save(PDF_PREFIX + '_Listone.pdf');
}

function exportRosaPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];

  ordered.forEach((team, idx) => {
    if (idx > 0) doc.addPage();
    pdfHeader(doc, (team.isMine ? '★ ' : '') + team.name, APP_NAME + ' — generato il ' + new Date().toLocaleDateString('it-IT'));

    const roster = teamRoster(team.id);
    const spent = teamSpent(team.id);

    doc.setFontSize(10);
    doc.setTextColor(20,20,20);
    doc.text('Budget totale: ' + state.budgetTotal + ' crediti  —  Spesi: ' + spent + '  —  Rimasti: ' + (state.budgetTotal - spent), 14, 33);

    const body = ['P','D','C','A'].flatMap(r => roster.filter(x => x.player.r === r)).map(({ player: p, price }) => {
      const prev = p.prev;
      const curr = p.curr && p.curr.pv > 0 ? p.curr : null;
      return [
        ROLE_META[p.r].short, p.nome, p.squadra, price, fmt0(p.fvm),
        prev ? fmt1(prev.fm) : '-', curr ? fmt1(curr.fm) : '-',
        setpieceText(p)
      ];
    });

    if (!body.length) {
      doc.text('Nessun giocatore assegnato a questa squadra.', 14, 45);
    } else {
      doc.autoTable({
        startY: 40,
        head: [['R', 'Nome', 'Squadra', 'Prezzo pagato', 'FVM', 'FM 25/26', 'FM 26/27', 'Palla ferma']],
        body,
        styles: { fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: [18, 51, 38], textColor: [240, 245, 241] },
        didParseCell: (data) => {
          if (data.section === 'body' && data.column.index === 7) highlightSetpieceCell(data);
        },
      });
    }
  });
  doc.save(PDF_PREFIX + '_LaTuaRosa.pdf');
}

function exportStatsPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const seasonLabel = state.statsSeason === '2627' ? 'Stagione 2026/27 (in corso, ' + META.max_pv_2627 + 'ᵃ giornata)' : 'Stagione 2025/26';
  pdfHeader(doc, seasonLabel, 'Filtro applicato: ' + (state.statsRole === 'all' ? 'tutti i ruoli' : ROLE_META[state.statsRole].label) + (state.statsTeam !== 'all' ? ', ' + state.statsTeam : ''));

  const list = filterStats();
  const body = list.map(p => [p.r, p.nome, p.squadra, fmt0(p.pv), fmt1(p.mv), fmt1(p.fm), fmt0(p.gf), fmt0(p.ass), fmt0(p.amm), fmt0(p.esp), setpieceText(p)]);

  doc.autoTable({
    startY: 33,
    head: [['R', 'Nome', 'Squadra', 'PG', 'MV', 'FM', 'Gol', 'Ass', 'Amm', 'Esp', 'Palla ferma']],
    body,
    styles: { fontSize: 7.5, cellPadding: 1.3 },
    headStyles: { fillColor: [18, 51, 38], textColor: [240, 245, 241] },
    didParseCell: (data) => {
      if (data.section === 'body' && data.column.index === 10) highlightSetpieceCell(data);
    },
  });

  doc.save(PDF_PREFIX + '_Statistiche_' + state.statsSeason + '.pdf');
}
/* =========================================================
   Benedetto Dal Signore Entourage 26/27 — init & navigazione
   ========================================================= */

const SECTIONS = {
  prepara: {
    label: "Prepara l'asta",
    views: {
      listone: { label: 'Listone', render: renderListoneTab, icon: 'shirt' },
      stats: { label: 'Statistiche', render: renderStatsTab, icon: 'bars' },
    },
  },
  giorno: {
    label: "Il giorno dell'asta",
    views: {
      live: { label: 'Asta live', render: renderAstaTab, icon: 'coin' },
      export: { label: 'Esporta PDF', render: renderExportTab, icon: 'download' },
    },
  },
};

const NAV_ICONS = {
  shirt: '<svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l1 3-1 2H8L7 6l1-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8L5 9l1 4 2-1v9h8v-9l2 1 1-4-3-1" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  bars: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  coin: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5v9M9.3 9.3c0-1.1 1.2-2 2.7-2s2.7.7 2.7 1.7c0 2.3-5.4 1-5.4 3.3 0 1 1.2 1.7 2.7 1.7s2.7-.9 2.7-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-3.5-3.5M12 15l3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
};

state.section = state.section || 'prepara';
state.prepareView = state.prepareView || 'listone';
state.giornoView = state.giornoView || 'live';

function currentViewKey() {
  return state.section === 'prepara' ? state.prepareView : state.giornoView;
}
function setCurrentViewKey(v) {
  if (state.section === 'prepara') state.prepareView = v;
  else state.giornoView = v;
}

function renderShell() {
  const app = document.getElementById('app');
  const section = SECTIONS[state.section];
  const viewKey = currentViewKey();

  const subnavHtml = Object.keys(section.views).map(k => {
    const v = section.views[k];
    return `<button class="subnav-btn ${viewKey === k ? 'active' : ''}" data-view="${k}">${NAV_ICONS[v.icon]}<span>${v.label}</span></button>`;
  }).join('');

  app.innerHTML = `<div class="subnav-row">${subnavHtml}</div><div id="view-root"></div>`;

  app.querySelectorAll('.subnav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setCurrentViewKey(btn.dataset.view);
      renderShell();
    });
  });

  section.views[viewKey].render();
}

function switchSection(section) {
  state.section = section;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === section));
  try { window.scrollTo(0, 0); } catch (e) { /* jsdom / older browsers */ }
  renderShell();
}

function initNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.section));
  });
}

function init() {
  loadState();
  initNav();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === state.section));
  renderShell();
}

document.addEventListener('DOMContentLoaded', init);

document.getElementById('header-count').innerHTML = '<b>' + PLAYERS_CURRENT.length + '</b><span>giocatori nel listone</span>';
</script>
