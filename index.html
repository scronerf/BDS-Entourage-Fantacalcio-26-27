/* =========================================================
   Export CSV per l'importazione rose su leghe Fantagazzetta.
   Colonne fisse richieste dalla piattaforma: Id, Calciatore,
   Ruolo, Squadra, Fantasquadra, Prezzo — un giocatore per riga.
   Funziona anche a rose parziali: esporta solo chi è già stato
   assegnato in questo momento dell'asta.
   ========================================================= */

function csvEscape(val) {
  const s = String(val == null ? '' : val);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function exportFantagazzettaCSV() {
  const rows = [['Id', 'Calciatore', 'Ruolo', 'Squadra', 'Fantasquadra', 'Prezzo']];
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];
  ordered.forEach(t => {
    teamRoster(t.id)
      .slice()
      .sort((a, b) => ROLE_META[a.player.r].order - ROLE_META[b.player.r].order || b.price - a.price)
      .forEach(({ player: p, price }) => {
        rows.push([p.id, p.nome.toUpperCase(), p.r, p.squadra, t.name, price]);
      });
  });
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = PDF_PREFIX + '_Fantagazzetta.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* =========================================================
   Backup completo — export/import JSON. L'app è local-only
   (nessun server, nessuna sincronizzazione): questo è l'unico
   modo per portarsi dietro rose, piani budget, preferiti e
   archivio stagioni su un altro dispositivo o come sicurezza
   prima di un cambio drastico (es. reset per la prossima asta).
   ========================================================= */

function buildBackupPayload() {
  return {
    app: APP_NAME,
    kind: 'bds-entourage-backup',
    version: 1,
    exportedAt: new Date().toISOString(),
    state: {
      budgetTotal: state.budgetTotal,
      teams: state.teams,
      assignments: state.assignments,
      favorites: state.favorites,
      budgetPlans: state.budgetPlans,
      activePlanId: state.activePlanId,
      theme: state.theme,
    },
    archive: loadArchive(),
  };
}

function exportBackupJSON() {
  const payload = buildBackupPayload();
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0, 10);
  a.download = PDF_PREFIX + '_Backup_' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  backupStatus('Backup scaricato ✓');
}

function backupStatus(msg, isError) {
  const el = document.getElementById('backup-status');
  if (!el) return;
  el.textContent = msg || '';
  el.classList.toggle('kiosk-status-error', !!isError);
}

function importBackupFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(String(reader.result));
    } catch (e) {
      backupStatus('Il file scelto non è un JSON valido.', true);
      return;
    }
    if (!data || typeof data !== 'object' || !data.state || typeof data.state !== 'object') {
      backupStatus('Questo file non sembra un backup di ' + APP_NAME + '.', true);
      return;
    }
    const teamCount = Array.isArray(data.state.teams) ? data.state.teams.length : 0;
    const playerCount = data.state.assignments ? Object.keys(data.state.assignments).length : 0;
    const archiveCount = Array.isArray(data.archive) ? data.archive.length : 0;
    const msg = 'Importare questo backup (' + teamCount + ' squadre, ' + playerCount + ' giocatori assegnati' +
      (archiveCount ? ', ' + archiveCount + ' stagioni in archivio' : '') +
      ')?\n\nSovrascriverà tutti i dati attuali su questo dispositivo — rose, budget, preferiti' +
      (Array.isArray(data.archive) ? ' e archivio stagioni' : '') + '.';
    if (!window.confirm(msg)) { backupStatus(''); return; }

    state = Object.assign({}, state, data.state);
    if (!Array.isArray(state.teams) || !state.teams.length) state.teams = [{ id: uid(), name: 'La mia squadra', isMine: true }];
    if (!state.teams.some(t => t.isMine)) state.teams[0].isMine = true;
    if (!state.assignments || typeof state.assignments !== 'object') state.assignments = {};
    if (!Array.isArray(state.favorites)) state.favorites = [];
    if (!Array.isArray(state.budgetPlans)) state.budgetPlans = [];
    if (!state.activePlanId) state.activePlanId = 'consigliato';
    state.astaTeamFilter = getMyTeam().id;
    saveState();
    if (Array.isArray(data.archive)) saveArchive(data.archive);

    backupStatus('Backup importato ✓ Ricarico l\'app…');
    setTimeout(() => window.location.reload(), 700);
  };
  reader.onerror = () => backupStatus('Non sono riuscito a leggere il file.', true);
  reader.readAsText(file);
}

/* ---------- raccolta dati condivisa ---------- */

function gatherKioskData() {
  applyKioskTheme();
  const teamsOrdered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];
  const teamData = teamsOrdered.map(t => {
    const roster = teamRoster(t.id);
    const byRole = { P: [], D: [], C: [], A: [] };
    roster.forEach(r => byRole[r.player.r].push(r));
    KIOSK_ROLE_ORDER.forEach(r => byRole[r].sort((a, b) => b.price - a.price));
    const roleSpend = { P: 0, D: 0, C: 0, A: 0 };
    roster.forEach(r => { roleSpend[r.player.r] += r.price; });
    return { team: t, roster, byRole, roleSpend, kpi: teamKpis(t.id) };
  });
  const pagella = teamData.slice().sort((a, b) => b.kpi.overall - a.kpi.overall);
  const { best, worst } = leagueBestWorstPicks();
  const assignedCount = Object.keys(state.assignments).length;
  const rosterTarget = teamsOrdered.length * (ROLE_SLOT_COUNT.P + ROLE_SLOT_COUNT.D + ROLE_SLOT_COUNT.C + ROLE_SLOT_COUNT.A);
  return { teamData, pagella, best, worst, budgetTotal: state.budgetTotal, assignedCount, rosterTarget, generatedAt: new Date() };
}

/* ---------- risorse: font e logo ---------- */

let kioskLogoImgPromise = null;
function kioskLogoImage() {
  if (!kioskLogoImgPromise) {
    kioskLogoImgPromise = new Promise((resolve) => {
      const srcEl = document.querySelector('.brand-mark img');
      if (!srcEl || !srcEl.src) { resolve(null); return; }

      img.onload = () => resolve(img);
      img.onerror = () => resolve(null);
      img.src = srcEl.src;
    });

  return kioskLogoImgPromise;

function ensureKioskFontsReady() {
  if (!(document.fonts && document.fonts.load)) return Promise.resolve();
  const specs = ['500 16px Inter', '600 16px Inter', '700 16px Inter', '500 16px Oswald', '600 16px Oswald', '700 16px Oswald'];
  return Promise.all(specs.map(f => document.fonts.load(f).catch(() => {})))
    .then(() => (document.fonts.ready || Promise.resolve()))
    .catch(() => {});
}

/* ---------- helper di disegno generici ---------- */

function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawPanel(ctx, x, y, w, h, opts) {
  opts = opts || {};
  roundRectPath(ctx, x, y, w, h, opts.radius != null ? opts.radius : 12);
  ctx.fillStyle = opts.fill || KIOSK_COLORS.panel;
  ctx.fill();
  if (opts.stroke) {
    ctx.lineWidth = opts.strokeWidth || 1.5;
    ctx.strokeStyle = opts.stroke;
    ctx.stroke();
  }
}

function truncateText(ctx, text, maxWidth) {
  if (maxWidth <= 0) return '';
  if (ctx.measureText(text).width <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    const cand = text.slice(0, mid).trimEnd() + '…';
    if (ctx.measureText(cand).width <= maxWidth) lo = mid; else hi = mid - 1;
  }
  return text.slice(0, lo).trimEnd() + '…';
}

function wrapKioskText(ctx, text, maxWidth, maxLines) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let cur = '';
  for (const w of words) {
    const cand = cur ? cur + ' ' + w : w;
    if (ctx.measureText(cand).width <= maxWidth || !cur) cur = cand;
    else { lines.push(cur); cur = w; }
    if (lines.length === maxLines - 1) break;
  }
  if (cur) lines.push(cur);
  const rest = words.slice(lines.join(' ').split(/\s+/).length).join(' ');
  if (lines.length >= maxLines && rest) {
    lines[maxLines - 1] = truncateText(ctx, lines[maxLines - 1], maxWidth);
  }
  return lines.slice(0, maxLines);
}

function drawKioskBackground(ctx, w, h) {
  const grad = ctx.createRadialGradient(w * 0.5, h * -0.06, 0, w * 0.5, h * 0.45, Math.max(w, h) * 0.85);
  grad.addColorStop(0, KIOSK_COLORS.vigCenter);
  grad.addColorStop(0.55, KIOSK_COLORS.bg);
  grad.addColorStop(1, KIOSK_COLORS.vigEdge);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.globalAlpha = 0.04;
  ctx.strokeStyle = KIOSK_COLORS.ink;
  ctx.lineWidth = 2;
  for (let x = -h; x < w; x += 52) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + h, h);
    ctx.stroke();
  }
  ctx.restore();
  const ribbon = ctx.createLinearGradient(0, 0, w, 0);
  ribbon.addColorStop(0, KIOSK_COLORS.turf);
  ribbon.addColorStop(0.5, KIOSK_COLORS.turfBright);
  ribbon.addColorStop(1, KIOSK_COLORS.turf);
  ctx.fillStyle = ribbon;
  ctx.fillRect(0, 0, w, 6);
  ctx.fillStyle = KIOSK_COLORS.gold;
  ctx.fillRect(0, 6, w, 2);
}

function makeKioskCanvas(width, height) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(width * dpr));
  canvas.height = Math.max(1, Math.round(height * dpr));
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.textBaseline = 'alphabetic';
  return { canvas, ctx, width, height };
}

function downloadCanvas(canvas, filename) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => {
      if (!blob) { resolve(false); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      resolve(true);
    }, 'image/png');
  });
}

/* ---------- intestazione e piè di pagina condivisi ---------- */

function drawKioskHeader(ctx, x, y, w, logoImg, title, subtitle) {
  const logoSize = 60;
  if (logoImg) {
    ctx.save();
    roundRectPath(ctx, x, y, logoSize, logoSize, 14);
    ctx.strokeStyle = KIOSK_COLORS.gold;
    ctx.lineWidth = 2;
    ctx.stroke();
    roundRectPath(ctx, x, y, logoSize, logoSize, 14);
    ctx.clip();
    ctx.drawImage(logoImg, x, y, logoSize, logoSize);
    ctx.restore();
  }
  const textX = x + (logoImg ? logoSize + 20 : 0);
  const textW = w - (logoImg ? logoSize + 20 : 0);
  ctx.textAlign = 'left';
  ctx.fillStyle = KIOSK_COLORS.gold;
  ctx.font = '700 34px Oswald';
  ctx.fillText(truncateText(ctx, title.toUpperCase(), textW), textX, y + 32);
  ctx.fillStyle = KIOSK_COLORS.inkDim;
  ctx.font = '500 16px Inter';
  ctx.fillText(truncateText(ctx, subtitle, textW), textX, y + 55);
  const bottom = y + logoSize + 14;
  ctx.strokeStyle = KIOSK_COLORS.lineStrong;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, bottom);
  ctx.lineTo(x + w, bottom);
  ctx.stroke();
  return bottom + 22;
}

function drawKioskFooter(ctx, x, y, w) {
  ctx.strokeStyle = KIOSK_COLORS.line;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + w, y);
  ctx.stroke();
  ctx.fillStyle = KIOSK_COLORS.inkFaint;
  ctx.font = '400 13px Inter';
  ctx.textAlign = 'left';
  const stamp = new Date().toLocaleString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  ctx.fillText('Generato il ' + stamp + ' · ' + APP_NAME, x, y + 24);
  ctx.textAlign = 'right';
  ctx.fillStyle = KIOSK_COLORS.inkFaint;
  ctx.fillText('Foto dell\'asta in questo momento — non aggiornata in automatico', x + w, y + 24);
  ctx.textAlign = 'left';
}

/* ---------- pannello squadra (rosa completa, ruolo per ruolo) ---------- */

function estimateTeamPanelHeight(td) {
  let h = KP.PAD * 2 + KP.HEADER;
  KIOSK_ROLE_ORDER.forEach(r => {
    const list = td.byRole[r];
    if (list.length) h += KP.SUBHEAD + list.length * KP.ROW + KP.GAP_ROLE;
  });
  if (!td.roster.length) h += 30;
  return h;
}

function tierDotColor(tier) {
  switch (tier) {
    case 'top': return KIOSK_COLORS.tierTop;
    case 'buono': return KIOSK_COLORS.tierBuono;
    case 'scommessa': return KIOSK_COLORS.tierScommessa;
    case 'ultime': return KIOSK_COLORS.tierUltime;
    default: return KIOSK_COLORS.inkFaint;
  }
}

function drawTeamPanel(ctx, x, y, w, td) {
  const h = estimateTeamPanelHeight(td);
  const isMine = td.team.isMine;
  drawPanel(ctx, x, y, w, h, {
    fill: isMine ? KIOSK_COLORS.panel2 : KIOSK_COLORS.panel,
    stroke: isMine ? KIOSK_COLORS.gold : KIOSK_COLORS.line,
    strokeWidth: isMine ? 2.25 : 1,
    radius: KP.RADIUS,
  });
  const cx = x + KP.PAD;
  const innerW = w - KP.PAD * 2;
  let cy = y + KP.PAD;

  const chipW = 78, chipH = 36;
  ctx.textAlign = 'left';
  ctx.font = '700 23px Oswald';
  ctx.fillStyle = isMine ? KIOSK_COLORS.gold : KIOSK_COLORS.ink;
  const nameText = (isMine ? '★ ' : '') + td.team.name.toUpperCase();
  ctx.fillText(truncateText(ctx, nameText, innerW - chipW - 10), cx, cy + 19);

  const chipX = x + w - KP.PAD - chipW, chipY = cy - 6;
  drawPanel(ctx, chipX, chipY, chipW, chipH, { fill: KIOSK_COLORS.gold, radius: 9 });
  ctx.textAlign = 'center';
  ctx.fillStyle = KIOSK_COLORS.goldInk;
  ctx.font = '700 19px Oswald';
  ctx.fillText(String(Math.round(td.kpi.overall)), chipX + chipW / 2, chipY + 21);
  ctx.font = '600 10px Inter';
  ctx.fillText('/100', chipX + chipW / 2, chipY + 32);
  ctx.textAlign = 'left';

  const barY = cy + 32;
  drawPanel(ctx, cx, barY, innerW, 11, { fill: 'rgba(242,245,241,0.09)', radius: 6 });
  const pct = Math.max(0, Math.min(1, (td.kpi.spentPct || 0) / 100));
  if (pct > 0) drawPanel(ctx, cx, barY, Math.max(11, innerW * pct), 11, { fill: KIOSK_COLORS.turfBright, radius: 6 });

  const statsY = barY + 32;
  ctx.font = '600 15px Inter';
  ctx.fillStyle = KIOSK_COLORS.ink;
  ctx.fillText('Spesi ' + td.kpi.spent + '/' + state.budgetTotal + ' cr. (' + td.kpi.spentPct + '%)', cx, statsY);
  ctx.textAlign = 'right';
  ctx.fillStyle = KIOSK_COLORS.turfBright;
  ctx.font = '700 15px Inter';
  ctx.fillText(td.kpi.remaining + ' cr. residui', x + w - KP.PAD, statsY);
  ctx.textAlign = 'left';

  cy = y + KP.PAD + KP.HEADER;

  if (!td.roster.length) {
    ctx.fillStyle = KIOSK_COLORS.inkFaint;
    ctx.font = '500 14px Inter';
    ctx.fillText('Nessun giocatore ancora assegnato', cx, cy + 18);
    return h;
  }

  KIOSK_ROLE_ORDER.forEach(r => {
    const list = td.byRole[r];
    if (!list.length) return;
    ctx.fillStyle = KIOSK_COLORS.inkDim;
    ctx.font = '700 12.5px Inter';
    ctx.fillText(ROLE_META[r].short + ' · ' + ROLE_META[r].label.toUpperCase() + '  —  ' + td.roleSpend[r] + ' cr.', cx, cy + 12);
    ctx.strokeStyle = KIOSK_COLORS.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx, cy + 19);
    ctx.lineTo(cx + innerW, cy + 19);
    ctx.stroke();
    cy += KP.SUBHEAD;
    list.forEach(({ player: p, price }) => {
      const delta = price - p.qta;
      ctx.fillStyle = tierDotColor(p.tier);
      ctx.beginPath();
      ctx.arc(cx + 4, cy + 8, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = KIOSK_COLORS.ink;
      ctx.font = '500 14.5px Inter';
      ctx.fillText(truncateText(ctx, p.nome, innerW - 92), cx + 15, cy + 12.5);
      ctx.textAlign = 'right';
      ctx.fillStyle = delta < 0 ? KIOSK_COLORS.turfBright : (delta > 0 ? KIOSK_COLORS.tierScommessa : KIOSK_COLORS.inkDim);
      ctx.font = '700 14.5px Inter';
      ctx.fillText(price + ' cr.', cx + innerW, cy + 12.5);
      ctx.textAlign = 'left';
      cy += KP.ROW;
    });
    cy += KP.GAP_ROLE;
  });

  return h;
}

/* impacchetta i pannelli squadra in N colonne, riempiendo sempre
   la colonna piu' corta (le rose non hanno tutte la stessa altezza) */
function packTeamColumns(teamDataList, columns) {
  const cols = Array.from({ length: columns }, () => []);
  const heights = new Array(columns).fill(0);
  teamDataList.forEach(td => {
    let shortest = 0;
    for (let i = 1; i < columns; i++) if (heights[i] < heights[shortest]) shortest = i;
    cols[shortest].push(td);
    heights[shortest] += estimateTeamPanelHeight(td) + 20;
  });
  return { cols, gridHeight: Math.max(...heights) - 20 };
}

function drawTeamGrid(ctx, x, y, w, teamDataList, columns) {
  const gap = 20;
  const colW = (w - gap * (columns - 1)) / columns;
  const { cols, gridHeight } = packTeamColumns(teamDataList, columns);
  cols.forEach((col, i) => {
    let cy = y;
    const cx = x + i * (colW + gap);
    col.forEach(td => {
      drawTeamPanel(ctx, cx, cy, colW, td);
      cy += estimateTeamPanelHeight(td) + gap;
    });
  });
  return gridHeight;
}

/* ---------- colpi della lega ---------- */

function estimateColpiHeight(mode, showTitle) {
  return (showTitle === false ? 0 : 40) + (mode === 'split' ? 118 : 118 * 2 + 16);
}

function drawColpiCard(ctx, x, y, w, entry, kind) {
  const h = 118;

  drawPanel(ctx, x, y, w, h, {
    fill: KIOSK_COLORS.panel,
    stroke: good ? KIOSK_COLORS.turfBright : KIOSK_COLORS.cardRed,
    strokeWidth: 2,
    radius: 14,
  });
  drawPanel(ctx, x, y, 6, h, { fill: good ? KIOSK_COLORS.turfBright : KIOSK_COLORS.cardRed, radius: 3 });
  const cx = x + 26, innerW = w - 46;
  ctx.textAlign = 'left';
  ctx.fillStyle = good ? KIOSK_COLORS.turfBright : KIOSK_COLORS.cardRed;
  ctx.font = '700 13px Inter';
  ctx.fillText((good ? 'MIGLIOR AFFARE' : 'COLPO PIU\' CARO') + ' DELLA LEGA', cx, y + 26);
  ctx.fillStyle = KIOSK_COLORS.ink;
  ctx.font = '700 22px Oswald';
  ctx.fillText(truncateText(ctx, entry.player.nome, innerW), cx, y + 56);
  ctx.fillStyle = KIOSK_COLORS.inkDim;
  ctx.font = '500 14px Inter';
  ctx.fillText(truncateText(ctx, entry.team.name, innerW * 0.6), cx, y + 78);
  ctx.font = '700 14px Inter';
  ctx.fillStyle = good ? KIOSK_COLORS.turfBright : KIOSK_COLORS.tierScommessa;
  const deltaTxt = (entry.delta > 0 ? '+' : '') + entry.delta + ' cr. vs quotazione';
  ctx.textAlign = 'right';
  ctx.fillText(deltaTxt, x + w - 26, y + 78);
  ctx.textAlign = 'left';
  ctx.fillStyle = KIOSK_COLORS.ink;
  ctx.font = '700 26px Oswald';
  ctx.fillText(entry.price + ' cr.', cx, y + 105);
  ctx.textAlign = 'right';
  ctx.fillStyle = KIOSK_COLORS.inkFaint;
  ctx.font = '500 13px Inter';
  ctx.fillText('quotazione base ' + fmt0(entry.player.qta), x + w - 26, y + 105);
  ctx.textAlign = 'left';
}

function drawColpiSection(ctx, x, y, w, kioskData, mode, showTitle) {
  let top = y;
  if (showTitle !== false) {
    ctx.fillStyle = KIOSK_COLORS.gold;
    ctx.font = '700 24px Oswald';
    ctx.textAlign = 'left';
    ctx.fillText('COLPI DELLA LEGA', x, y + 22);
    top = y + 40;
  }
  if (!kioskData.best && !kioskData.worst) {
    ctx.fillStyle = KIOSK_COLORS.inkFaint;
    ctx.font = '500 14px Inter';
    ctx.fillText('Nessun acquisto ancora registrato.', x, top + 20);
    return (showTitle === false ? 0 : 40) + 40;
  }
  if (mode === 'split') {
    const gap = 20, cardW = (w - gap) / 2;
    if (kioskData.best) drawColpiCard(ctx, x, top, cardW, kioskData.best, 'best');
    if (kioskData.worst) drawColpiCard(ctx, x + cardW + gap, top, cardW, kioskData.worst, 'worst');
  } else {
    if (kioskData.best) drawColpiCard(ctx, x, top, w, kioskData.best, 'best');
    if (kioskData.worst) drawColpiCard(ctx, x, top + (kioskData.best ? 118 + 16 : 0), w, kioskData.worst, 'worst');
  }
  return estimateColpiHeight(mode, showTitle);
}

/* ---------- pagella di lega ---------- */

const KIOSK_PAGELLA_ROW_H = 54;

function estimatePagellaHeight(n, showTitle) {
  return (showTitle === false ? 8 : 48) + Math.max(1, n) * KIOSK_PAGELLA_ROW_H + 10;
}

function drawPagellaSection(ctx, x, y, w, kioskData, showTitle) {
  let cy;
  if (showTitle !== false) {
    ctx.fillStyle = KIOSK_COLORS.gold;
    ctx.font = '700 24px Oswald';
    ctx.textAlign = 'left';
    ctx.fillText('PAGELLA DI LEGA', x, y + 22);
    cy = y + 48;
  } else {
    cy = y + 8;
  }
  const rowH = KIOSK_PAGELLA_ROW_H;
  kioskData.pagella.forEach((td, idx) => {
    const isMine = td.team.isMine;
    drawPanel(ctx, x, cy, w, rowH - 8, {
      fill: idx === 0 ? 'rgba(227,179,65,0.14)' : (isMine ? 'rgba(63,174,110,0.09)' : KIOSK_COLORS.panel),
      stroke: idx === 0 ? KIOSK_COLORS.gold : (isMine ? KIOSK_COLORS.turfBright : KIOSK_COLORS.line),
      strokeWidth: idx === 0 || isMine ? 1.5 : 1,
      radius: 10,
    });
    ctx.fillStyle = idx === 0 ? KIOSK_COLORS.gold : KIOSK_COLORS.inkDim;
    ctx.font = '700 16px Oswald';
    ctx.textAlign = 'left';
    ctx.fillText('#' + (idx + 1), x + 16, cy + 22);
    ctx.fillStyle = isMine ? KIOSK_COLORS.gold : KIOSK_COLORS.ink;
    ctx.font = '700 16px Inter';
    const nameText = (isMine ? '★ ' : '') + td.team.name;
    ctx.fillText(truncateText(ctx, nameText, w * 0.36), x + 58, cy + 20);
    ctx.fillStyle = KIOSK_COLORS.inkDim;
    ctx.font = '500 13px Inter';
    ctx.fillText(truncateText(ctx, votoGiudizio(td.kpi.overall), w * 0.26), x + 58, cy + 38);
    ctx.textAlign = 'right';
    ctx.fillStyle = KIOSK_COLORS.inkDim;
    ctx.font = '500 13px Inter';
    ctx.fillText(td.kpi.spent + '/' + state.budgetTotal + ' cr.', x + w - 130, cy + 20);
    ctx.font = '400 12px Inter';
    ctx.fillText(td.kpi.count + ' giocatori', x + w - 130, cy + 38);
    const suffix = '/100';
    ctx.font = '600 12px Inter';
    const suffixW = ctx.measureText(suffix).width;
    ctx.fillStyle = KIOSK_COLORS.inkFaint;
    ctx.fillText(suffix, x + w - 16, cy + 30);
    ctx.fillStyle = KIOSK_COLORS.gold;
    ctx.font = '700 26px Oswald';
    ctx.fillText(String(Math.round(td.kpi.overall)), x + w - 16 - suffixW - 4, cy + 30);
    ctx.textAlign = 'left';
    cy += rowH;
  });
  return estimatePagellaHeight(kioskData.pagella.length, showTitle);
}

/* =========================================================
   Pannello squadra — riepilogo persistente. Su desktop è una
   colonna laterale sempre visibile; su mobile è lo stesso
   contenuto richiamato come foglio dalla pillola budget in testata.
   Un solo componente, due punti di aggancio nel DOM.
   ========================================================= */

function roleMaxFVM(role) {
  let max = 0;
  PLAYERS_CURRENT.forEach(p => { if (p.r === role && p.fvm > max) max = p.fvm; });
  return max || 1;
}

/* Overall Rosa 0-100: per ogni reparto, quanto la qualità media della rosa
   si avvicina al miglior FVM disponibile in quel reparto sul listone,
   pesato secondo ROLE_BUDGET_SPLIT. Usata sia nel pannello sia nel PDF rose. */
function overallRosaScore(teamId) {
  const roster = teamRoster(teamId);
  let score = 0;
  ['P', 'D', 'C', 'A'].forEach(r => {
    const inRole = roster.filter(x => x.player.r === r).map(x => x.player.fvm);
    const avg = inRole.length ? inRole.reduce((a, b) => a + b, 0) / inRole.length : 0;
    const quality = Math.min(1, avg / roleMaxFVM(r));
    score += quality * ROLE_BUDGET_SPLIT[r];
  });
  return Math.round(score * 100);
}

/* KPI di una squadra, usati sia dalla Pagella (schermo + PDF) sia dall'archivio stagioni.
   Riusano solo dati già presenti in rosa — nessuna richiesta di dati nuovi. */
function teamKpis(teamId) {
  const roster = teamRoster(teamId);
  const spent = teamSpent(teamId);
  const overall = overallRosaScore(teamId);
  const roleCounts = { P: 0, D: 0, C: 0, A: 0 };
  let riskSpent = 0, setPieceCount = 0, deltaSum = 0;
  roster.forEach(({ player: p, price }) => {
    roleCounts[p.r]++;
    if (p.tier === 'scommessa' || p.tier === 'ultime') riskSpent += price;
    if (p.rig_ord || p.piaz_ord) setPieceCount++;
    deltaSum += (price - p.qta);
  });
  return {
    spent,
    remaining: state.budgetTotal - spent,
    spentPct: state.budgetTotal > 0 ? Math.round((spent / state.budgetTotal) * 100) : 0,
    overall,
    voto: Math.round(overall) + '/100',
    count: roster.length,
    roleCounts,
    riskShare: spent > 0 ? Math.round((riskSpent / spent) * 100) : 0,
    setPieceCount,
    avgDelta: roster.length ? Math.round((deltaSum / roster.length) * 10) / 10 : 0,
  };
}

/* il colpo più sotto quotazione e quello più sopra, su tutte le squadre della lega */
function leagueBestWorstPicks() {
  let best = null, worst = null;
  state.teams.forEach(t => {
    teamRoster(t.id).forEach(({ player: p, price }) => {
      const delta = price - p.qta;
      const entry = { team: t, player: p, price, delta };
      if (!best || delta < best.delta) best = entry;
      if (!worst || delta > worst.delta) worst = entry;
    });
  });
  return { best, worst };
}

/* voto in stile pagellone: numero + giudizio breve, coerente con l'Overall Rosa 0-100 */
function votoGiudizio(overall) {
  if (overall >= 85) return 'Rosa da podio';
  if (overall >= 70) return 'Rosa solida';
  if (overall >= 50) return 'Nella media';
  if (overall >= 30) return 'Rosa incompleta';
  return 'Da rivedere';
}

/* =========================================================
   Archivio stagioni — istantanee della pagella, salvate a parte
   da STATE_KEY apposta: ogni estate il listone e le statistiche
   vengono rigenerati da zero con i nuovi dati, ma l'archivio deve
   sopravvivere invariato a quell'aggiornamento, stagione dopo stagione.
   ========================================================= */

const ARCHIVE_KEY = 'fantaAsta_archivio_stagioni_v1';

function loadArchive() {
  try {
    const raw = localStorage.getItem(ARCHIVE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (e) { return []; }
}

function saveArchive(list) {
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(list)); } catch (e) { /* storage piena o non disponibile */ }
}

function archiveCurrentSeason(label) {
  const list = loadArchive();
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];
  const snapshot = {
    id: uid(),
    savedAt: new Date().toISOString(),
    label: (label && label.trim()) ? label.trim() : 'Stagione senza nome',
    budgetTotal: state.budgetTotal,
    teams: ordered.map(t => Object.assign({ name: t.name, isMine: !!t.isMine }, teamKpis(t.id))),
  };
  list.unshift(snapshot);
  saveArchive(list);
  return snapshot;
}

function deleteArchiveEntry(id) {
  saveArchive(loadArchive().filter(s => s.id !== id));
}

/* =========================================================
   Piani di divisione crediti — il pianificatore "Per reparto" non
   mostra più solo le % consigliate: Paolo può creare più piani,
   salvarli e passare dall'uno all'altro. Il piano "Consigliato"
   resta fisso (stesse % di ROLE_BUDGET_SPLIT, usate anche per
   l'Overall Rosa e la Pagella di lega, per restare comparabile
   con le altre squadre); i piani personalizzati sono solo
   un aiuto di pianificazione personale.
   ========================================================= */

function evenSlotSplit(totalCredits, count) {
  if (count <= 0) return [];
  const base = Math.floor(totalCredits / count);
  let rem = totalCredits - base * count;
  const arr = [];
  for (let i = 0; i < count; i++) {
    arr.push(base + (rem > 0 ? 1 : 0));
    if (rem > 0) rem--;
  }
  return arr;
}

function builtinPlan() {
  const split = {
    P: Math.round(ROLE_BUDGET_SPLIT.P * 100), D: Math.round(ROLE_BUDGET_SPLIT.D * 100),
    C: Math.round(ROLE_BUDGET_SPLIT.C * 100), A: Math.round(ROLE_BUDGET_SPLIT.A * 100),
  };
  const slots = {};
  ['P', 'D', 'C', 'A'].forEach(r => {
    slots[r] = evenSlotSplit(Math.round(state.budgetTotal * split[r] / 100), ROLE_SLOT_COUNT[r]);
  });
  return { id: 'consigliato', name: 'Consigliato', split, slots, builtin: true };
}

function getBudgetPlans() {
  return [builtinPlan(), ...state.budgetPlans];
}

function getActivePlan() {
  return getBudgetPlans().find(p => p.id === state.activePlanId) || builtinPlan();
}

function roleTargetForPlan(plan, role) {
  return Math.round(state.budgetTotal * (plan.split[role] || 0) / 100);
}

function createBudgetPlan(name) {
  const base = getActivePlan();
  const plan = {
    id: uid(),
    name: (name && name.trim()) ? name.trim() : ('Piano ' + (state.budgetPlans.length + 1)),
    split: Object.assign({}, base.split),
    slots: { P: base.slots.P.slice(), D: base.slots.D.slice(), C: base.slots.C.slice(), A: base.slots.A.slice() },
  };
  state.budgetPlans.push(plan);
  state.activePlanId = plan.id;
  saveState();
  return plan;
}

function deleteBudgetPlan(id) {
  if (id === 'consigliato') return;
  state.budgetPlans = state.budgetPlans.filter(p => p.id !== id);
  if (state.activePlanId === id) state.activePlanId = 'consigliato';
  saveState();
}

function renameBudgetPlan(id, name) {
  const plan = state.budgetPlans.find(p => p.id === id);
  if (plan && name && name.trim()) { plan.name = name.trim(); saveState(); }
}

function updatePlanSplit(id, role, pct) {
  const plan = state.budgetPlans.find(p => p.id === id);
  if (!plan) return;
  plan.split[role] = Math.max(0, Math.min(100, Math.round(pct) || 0));
  // i prezzi consigliati per singolo posto (slot) seguono la % appena
  // inserita: si ricalcolano su questo nuovo target, sovrascrivendo eventuali
  // modifiche manuali fatte in precedenza su quel reparto.
  plan.slots[role] = evenSlotSplit(roleTargetForPlan(plan, role), ROLE_SLOT_COUNT[role]);
  saveState();
}

function updatePlanSlot(id, role, idx, value) {
  const plan = state.budgetPlans.find(p => p.id === id);
  if (!plan || !plan.slots[role]) return;
  plan.slots[role][idx] = Math.max(0, Math.round(value) || 0);
  saveState();
}

function togglePlannerRole(role) {
  const idx = state.plannerOpenRoles.indexOf(role);
  if (idx === -1) state.plannerOpenRoles.push(role); else state.plannerOpenRoles.splice(idx, 1);
}

function planSwitcherHtml() {
  const plans = getBudgetPlans();
  const active = getActivePlan();
  const sumPct = ['P', 'D', 'C', 'A'].reduce((s, r) => s + (active.split[r] || 0), 0);
  return `
    <div class="plan-switcher">

        ${plans.map(p => `<button class="plan-chip ${p.id === active.id ? 'active' : ''}" data-plan="${p.id}" type="button">${escapeAttr(p.name)}</button>`).join('')}
        <button class="plan-chip plan-chip-add" id="plan-add-btn" type="button">+ Nuovo piano</button>
      </div>
      ${!active.builtin ? `
        <div class="plan-manage-row">
          <input type="text" id="plan-name-input" value="${escapeAttr(active.name)}" placeholder="Nome piano">
          <button class="plan-delete-btn" id="plan-delete-btn" type="button" aria-label="Elimina piano">
            <svg viewBox="0 0 24 24" class="ic-mini"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </button>
        </div>` : `<p class="plan-hint">Il piano Consigliato segue le percentuali standard (6/20/32/42%) e non si modifica — crea un piano nuovo per personalizzarlo. L'Overall Rosa e la Pagella di lega restano sempre calcolati sul Consigliato, per confrontare le squadre alla pari.</p>`}
      ${sumPct !== 100 ? `<p class="plan-warning">Le percentuali di questo piano sommano a ${sumPct}%, non 100% — va bene se l'hai fatto apposta, controlla se invece era una svista.</p>` : ''}
    </div>`;
}

function rolePlannerRows(teamId) {
  const plan = getActivePlan();
  const editable = !plan.builtin;
  const spentByRole = {};
  const pricesByRole = { P: [], D: [], C: [], A: [] };
  teamRoster(teamId).forEach(({ player, price }) => {
    spentByRole[player.r] = (spentByRole[player.r] || 0) + price;
    pricesByRole[player.r].push(price);
  });
  Object.keys(pricesByRole).forEach(r => pricesByRole[r].sort((a, b) => b - a));
  const totalBudget = state.budgetTotal;

  return ['P', 'D', 'C', 'A'].map(r => {
    const target = roleTargetForPlan(plan, r);
    const spent = spentByRole[r] || 0;
    const pct = target > 0 ? Math.min(100, Math.round((spent / target) * 100)) : 0;
    const over = spent > target;
    const realPct = totalBudget > 0 ? Math.round((spent / totalBudget) * 100) : 0;
    const open = state.plannerOpenRoles.includes(r);
    const slots = plan.slots[r] || [];
    const slotsHtml = slots.map((amount, idx) => {
      const paid = pricesByRole[r][idx];
      const bought = paid !== undefined;
      const over = bought && paid > amount;
      return `
        <div class="slot-row${bought ? ' is-bought' : ''}${over ? ' is-over' : ''}">
          <span class="slot-label">${ROLE_META[r].short}${idx + 1}</span>
          <div class="slot-figure">
            <span class="slot-figure-cap">Doveva costare</span>
            <span class="slot-figure-val slot-figure-planned">${editable
              ? `<input type="number" min="0" class="slot-input" data-plan="${plan.id}" data-role="${r}" data-idx="${idx}" value="${amount}">cr.`
              : `${amount} cr.`}</span>
          </div>
          <div class="slot-figure">
            <span class="slot-figure-cap">Pagato</span>
            <span class="slot-figure-val slot-figure-paid">${bought ? paid + ' cr.' : 'da comprare'}</span>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="planner-row-wrap">
        <div class="planner-row">
          <span class="role-pill role-${r}">${ROLE_META[r].short}</span>
          <div class="planner-mid">
            <div class="planner-bar"><div class="planner-bar-fill${over ? ' over' : ''}" style="width:${pct}%"></div></div>
            <div class="planner-nums">
              <div class="planner-nums-main"><b>${spent}</b> su <b>${target}</b> crediti del piano</div>
              <div class="planner-nums-pct">
                <span class="planner-pct-tag">Piano reparto:
                  ${editable
                    ? `<input type="number" min="0" max="100" class="planner-pct-input" data-plan="${plan.id}" data-role="${r}" value="${plan.split[r]}">`
                    : `<b>${plan.split[r]}</b>`}% del budget</span>
                <span class="planner-pct-tag planner-pct-tag-real">Speso finora: <b>${realPct}</b>% del budget</span>
              </div>
            </div>
          </div>
          <button class="planner-expand-btn" data-role="${r}" type="button" aria-label="Dettaglio slot per giocatore">
            <svg viewBox="0 0 24 24" class="chev${open ? ' open' : ''}"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        ${open ? `<div class="slot-list">${slotsHtml}</div>` : ''}
      </div>`;
  }).join('') + (() => {
    const totalSpent = teamSpent(teamId);
    const totalPct = totalBudget > 0 ? Math.min(100, Math.round((totalSpent / totalBudget) * 100)) : 0;
    return `
      <div class="planner-row-wrap planner-total-wrap">
        <div class="planner-row">
          <span class="role-pill role-TOT">TOT</span>
          <div class="planner-mid">
            <div class="planner-bar"><div class="planner-bar-fill${totalSpent > totalBudget ? ' over' : ''}" style="width:${totalPct}%"></div></div>
            <div class="planner-nums">
              <div class="planner-nums-main"><b>${totalSpent}</b> su <b>${totalBudget}</b> crediti totali spesi nell'asta</div>
              <div class="planner-nums-pct">
                <span class="planner-pct-tag planner-pct-tag-real">Speso: <b>${totalPct}</b>% del budget</span>
              </div>
            </div>
          </div>
        </div>
      </div>`;
  })();
}

function chiMancaHtml() {
  const takenIds = new Set(Object.keys(state.assignments));
  return ['P', 'D', 'C', 'A'].map(r => {
    const best = PLAYERS_CURRENT.filter(p => p.r === r && !takenIds.has(String(p.id))).sort((a, b) => b.fvm - a.fvm).slice(0, 5);
    return `<div class="chimanca-role">
      <div class="chimanca-role-head">${ROLE_META[r].label}</div>
      ${best.length ? best.map(p => `<div class="chimanca-row" data-id="${p.id}">
        <span class="tier-dot ${TIER_META[p.tier].cls}"></span>
        <span class="chimanca-name">${p.nome}</span><span class="chimanca-team">${p.squadra}</span>
        <span class="chimanca-fvm">${fmt0(fvmForBudget(p.fvm))}</span>
      </div>`).join('') : '<div class="chimanca-empty">Non ne restano di rilievo.</div>'}
    </div>`;
  }).join('');
}

function preferitiHtml() {
  const takenIds = new Set(Object.keys(state.assignments));
  const favs = state.favorites
    .map(id => PLAYERS_CURRENT.find(p => String(p.id) === id))
    .filter(Boolean)
    .sort((a, b) => b.fvm - a.fvm);
  if (!favs.length) return `<div class="chimanca-empty">Nessun preferito ancora — tocca la stella su un giocatore nel Listone.</div>`;
  return favs.map(p => {
    const taken = takenIds.has(String(p.id));
    return `<div class="chimanca-row${taken ? ' is-taken' : ''}" data-id="${p.id}">
      <span class="tier-dot ${TIER_META[p.tier].cls}"></span>
      <span class="chimanca-name">${p.nome}</span><span class="chimanca-team">${p.squadra}</span>
      <span class="chimanca-fvm">${taken ? 'preso' : fmt0(fvmForBudget(p.fvm))}</span>
    </div>`;
  }).join('');
}

function teamPanelContentHtml() {
  const myTeam = getMyTeam();
  const spent = teamSpent(myTeam.id);
  const remaining = state.budgetTotal - spent;
  const pct = Math.min(100, Math.round((spent / state.budgetTotal) * 100));
  const count = teamRosterCount(myTeam.id);
  const overall = overallRosaScore(myTeam.id);
  const tabs = [['budget', 'Per reparto'], ['chimanca', 'Chi manca'], ['preferiti', 'Preferiti']];
  return `
    <div class="panel-head">
      <div class="panel-team-name">★ ${escapeAttr(myTeam.name)}</div>
      <div class="panel-budget-big"><b>${remaining}</b><span>crediti residui su ${state.budgetTotal}</span></div>
      <div class="budget-bar"><div class="budget-bar-fill" style="width:${pct}%"></div></div>
      <div class="panel-mini-stats"><span>${count} in rosa</span><span>Overall Rosa <b>${overall}</b>/100</span></div>
    </div>
    ${lastAction ? `<button class="panel-undo" id="panel-undo-btn" type="button">↩ Annulla — ${escapeAttr(lastAction.label)}</button>` : ''}
    <div class="panel-tabs">
      ${tabs.map(([k, label]) => `<button class="panel-tab ${state.panelTab === k ? 'active' : ''}" data-tab="${k}" type="button">${label}</button>`).join('')}
    </div>
    <div class="panel-body">
      ${state.panelTab === 'budget' ? `${planSwitcherHtml()}<div class="planner-rows">${rolePlannerRows(myTeam.id)}</div>` : ''}
      ${state.panelTab === 'chimanca' ? `<div class="chimanca-list">${chiMancaHtml()}</div>` : ''}
      ${state.panelTab === 'preferiti' ? `<div class="chimanca-list">${preferitiHtml()}</div>` : ''}
    </div>
  `;
}

function wireTeamPanelEvents(root) {
  const undoBtn = root.querySelector('#panel-undo-btn');
  if (undoBtn) undoBtn.addEventListener('click', () => {
    if (lastAction) { lastAction.undo(); lastAction = null; refreshAllViews(); }
  });
  root.querySelectorAll('.panel-tab').forEach(btn => btn.addEventListener('click', () => {
    state.panelTab = btn.dataset.tab;
    renderTeamPanel();
  }));
  root.querySelectorAll('.chimanca-row').forEach(row => row.addEventListener('click', () => {
    const p = PLAYERS_CURRENT.find(pl => String(pl.id) === row.dataset.id);
    if (p) openTeamPicker(p, () => refreshAllViews());
  }));
  root.querySelectorAll('.plan-chip[data-plan]').forEach(btn => btn.addEventListener('click', () => {
    state.activePlanId = btn.dataset.plan;
    saveState();
    renderTeamPanel();
  }));
  const planAddBtn = root.querySelector('#plan-add-btn');
  if (planAddBtn) planAddBtn.addEventListener('click', () => { createBudgetPlan(); renderTeamPanel(); });
  const planNameInput = root.querySelector('#plan-name-input');
  if (planNameInput) planNameInput.addEventListener('change', (e) => {
    renameBudgetPlan(getActivePlan().id, e.target.value);
    renderTeamPanel();
  });
  const planDeleteBtn = root.querySelector('#plan-delete-btn');
  if (planDeleteBtn) planDeleteBtn.addEventListener('click', () => {
    const active = getActivePlan();
    openConfirmSheet({
      title: 'Eliminare questo piano?',
      text: `"${escapeAttr(active.name)}" verrà eliminato. L'operazione non si può annullare.`,
      confirmLabel: 'Elimina',
      onConfirm: () => { deleteBudgetPlan(active.id); renderTeamPanel(); },
    });
  });
  root.querySelectorAll('.planner-pct-input').forEach(input => input.addEventListener('change', (e) => {
    updatePlanSplit(input.dataset.plan, input.dataset.role, parseFloat(e.target.value));
    renderTeamPanel();
  }));
  root.querySelectorAll('.slot-input').forEach(input => input.addEventListener('change', (e) => {
    updatePlanSlot(input.dataset.plan, input.dataset.role, parseInt(input.dataset.idx, 10), parseFloat(e.target.value));
    renderTeamPanel();
  }));
  root.querySelectorAll('.planner-expand-btn').forEach(btn => btn.addEventListener('click', () => {
    togglePlannerRole(btn.dataset.role);
    renderTeamPanel();
  }));
}

function renderTeamPanel() {
  const desktop = document.getElementById('team-panel-body');
  if (desktop) { desktop.innerHTML = teamPanelContentHtml(); wireTeamPanelEvents(desktop); }
  const mobile = document.getElementById('team-panel-mobile-body');
  if (mobile) { mobile.innerHTML = teamPanelContentHtml(); wireTeamPanelEvents(mobile); }
  const pill = document.getElementById('budget-pill');
  if (pill) {
    const myTeam = getMyTeam();
    const remaining = state.budgetTotal - teamSpent(myTeam.id);
    pill.innerHTML = `<b>${remaining}</b><span>cr.</span>`;
  }
}

function refreshTeamPanel() { renderTeamPanel(); renderSideRail(); }

/* richiamata dopo un annulla o un cambio che tocca più viste insieme */
function refreshAllViews() {
  renderTeamPanel();
  const section = SECTIONS[state.section];
  const viewKey = currentViewKey();
  if (section && section.views[viewKey]) section.views[viewKey].render();
}

function openTeamPanelSheet() {
  closeSheet();
  const backdrop = el('div', 'sheet-backdrop');
  backdrop.id = 'team-sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet panel-sheet">
      <div class="sheet-handle"></div>
      <div id="team-panel-mobile-body"></div>
      <button class="sheet-cancel-btn" id="panel-sheet-close">Chiudi</button>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) closeSheet(); });
  document.getElementById('panel-sheet-close').addEventListener('click', closeSheet);
  renderTeamPanel();
}

/* =========================================================
   Pagella — riepilogo di fine sessione per tutte le squadre
   della lega (non solo la tua), più l'archivio delle stagioni
   passate per confrontare come hai speso il budget nel tempo.
   ========================================================= */

function pagellaTemplate() {
  return `
    <div class="tab-head">
      <h1>Pagella</h1>
      <p class="tab-sub">Il riepilogo di fine sessione per tutte le squadre della lega — stesso calcolo dell'Overall Rosa del PDF, qui per tutti.</p>
    </div>
    <div id="pagella-ranking" class="pagella-list"></div>
    <h2 class="section-title">Colpi della lega</h2>
    <div id="pagella-picks" class="pair-list"></div>
    <h2 class="section-title">Archivio stagioni</h2>
    <p class="tab-sub" style="margin-top:-6px">Salva un'istantanea a fine asta per confrontare, l'anno prossimo, come avrai speso il budget stavolta.</p>
    <div class="archive-controls">
      <input type="text" id="archive-label" placeholder="Nome stagione" value="Stagione 2026/27">
      <button class="btn-primary" id="archive-save-btn" type="button">Salva pagella nell'archivio</button>
    </div>
    <div id="archive-list"></div>
  `;
}

function renderPagellaTab() {
  viewEl().innerHTML = pagellaTemplate();
  renderPagellaRanking();
  renderPagellaPicks();
  wirePagellaControls();
  renderArchiveList();
}

function pagellaRowHtml(row, rank) {
  const t = row.team;
  return `
    <div class="pagella-row${t.isMine ? ' is-mine' : ''}">
      <div class="pagella-rank">${rank}</div>
      <div class="pagella-id">
        <div class="pagella-name">${t.isMine ? '★ ' : ''}${escapeAttr(t.name)}</div>
        <div class="pagella-sub">${row.count} giocatori · ${row.spent}/${state.budgetTotal} cr. (${row.spentPct}%)</div>
        <div class="budget-bar"><div class="budget-bar-fill" style="width:${Math.min(100, row.spentPct)}%"></div></div>
      </div>
      <div class="pagella-voto">
        <div class="pagella-voto-num">${Math.round(row.overall)}<span class="pagella-voto-suffix">/100</span></div>
        <div class="pagella-voto-label">${votoGiudizio(row.overall)}</div>
      </div>
      <div class="pagella-kpis">
        <span title="Quota di crediti spesa su giocatori in fascia Scommessa o Ultime risorse">Rischio ${row.riskShare}%</span>
        <span title="Rigoristi e incaricati sui piazzati in rosa">${row.setPieceCount} palla ferma</span>
        <span title="Scostamento medio del prezzo pagato dalla quotazione base">${row.avgDelta > 0 ? '+' : ''}${row.avgDelta} cr. media/quotazione</span>
      </div>
    </div>`;
}

function renderPagellaRanking() {
  const container = document.getElementById('pagella-ranking');
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)]
    .map(t => Object.assign({ team: t }, teamKpis(t.id)))
    .sort((a, b) => b.overall - a.overall);
  container.innerHTML = ordered.map((row, idx) => pagellaRowHtml(row, idx + 1)).join('');
}

function leaguePickCardHtml(entry, good) {
  const sign = entry.delta > 0 ? '+' : '';
  const note = good
    ? `Pagato ${sign}${entry.delta} cr. rispetto alla quotazione base (${fmt0(entry.player.qta)}) — il miglior affare della lega.`
    : `Pagato ${sign}${entry.delta} cr. sopra la quotazione base (${fmt0(entry.player.qta)}).`;
  return `
    <div class="pair-card ${good ? 'pair-good' : 'pair-bad'}">
      <div class="pair-teams"><span>${escapeAttr(entry.player.nome)}</span><span>${entry.price} cr.</span></div>
      <p class="pair-note">${escapeAttr(entry.team.name)} · ${escapeAttr(entry.player.squadra)}<br>${note}</p>
    </div>`;
}

function renderPagellaPicks() {
  const container = document.getElementById('pagella-picks');
  const { best, worst } = leagueBestWorstPicks();
  if (!best && !worst) {
    container.innerHTML = `<div class="empty-state-mini">Nessun giocatore ancora assegnato a nessuna squadra.</div>`;
    return;
  }
  container.innerHTML = (best ? leaguePickCardHtml(best, true) : '') + (worst ? leaguePickCardHtml(worst, false) : '');
}

function wirePagellaControls() {
  document.getElementById('archive-save-btn').addEventListener('click', () => {
    const label = document.getElementById('archive-label').value;
    archiveCurrentSeason(label);
    renderArchiveList();
  });
}

function archiveEntryHtml(entry) {
  const date = new Date(entry.savedAt);
  const dateLabel = isNaN(date) ? '' : date.toLocaleDateString('it-IT');
  const rows = entry.teams.slice().sort((a, b) => b.overall - a.overall).map((t, idx) => `
    <div class="archive-mini-row">
      <span>${idx + 1}. ${t.isMine ? '★ ' : ''}${escapeAttr(t.name)}</span>
      <span>${t.voto} · ${t.spent}/${entry.budgetTotal} cr. · rischio ${t.riskShare}%</span>
    </div>`).join('');
  return `
    <div class="archive-entry" data-id="${entry.id}">
      <div class="archive-entry-head">
        <button class="archive-toggle-btn" type="button">
          <span class="archive-entry-title">${escapeAttr(entry.label)}</span>
          <span class="archive-entry-sub">${dateLabel} · ${entry.teams.length} squadre</span>
        </button>
        <button class="archive-delete-btn" data-id="${entry.id}" type="button" aria-label="Elimina istantanea">
          <svg viewBox="0 0 24 24" class="ic-mini"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="archive-entry-body">${rows}</div>
    </div>`;
}

function renderArchiveList() {
  const container = document.getElementById('archive-list');
  const list = loadArchive();
  if (!list.length) {
    container.innerHTML = `<div class="empty-state-mini">Nessuna stagione salvata ancora — a fine asta tocca "Salva pagella nell'archivio".</div>`;
    return;
  }
  container.innerHTML = list.map(archiveEntryHtml).join('');
  container.querySelectorAll('.archive-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.closest('.archive-entry').classList.toggle('open'));
  });
  container.querySelectorAll('.archive-delete-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openConfirmSheet({
        title: 'Eliminare questa istantanea?',
        text: `"${escapeAttr(list.find(s => s.id === btn.dataset.id) ? list.find(s => s.id === btn.dataset.id).label : '')}" verrà rimossa dall'archivio. L'operazione non si può annullare.`,
        confirmLabel: 'Elimina',
        onConfirm: () => { deleteArchiveEntry(btn.dataset.id); renderArchiveList(); },
      });
    });
  });
}

/* =========================================================
   Benedetto Dal Signore Entourage 26/27 — init & navigazione
   ========================================================= */

const SECTIONS = {
  prepara: {
    label: "Prepara l'asta",
    views: {
      listone: { label: 'Listone', render: renderListoneTab, icon: 'shirt' },
      stats: { label: 'Statistiche', render: renderStatsTab, icon: 'bars' },
    },
  },
  giorno: {
    label: "Il giorno dell'asta",
    views: {
      live: { label: 'Asta live', render: renderAstaTab, icon: 'coin' },
      pagella: { label: 'Pagella', render: renderPagellaTab, icon: 'trophy' },
      export: { label: 'Esporta PDF', render: renderExportTab, icon: 'download' },
    },
  },
};

const NAV_ICONS = {
  shirt: '<svg viewBox="0 0 24 24" fill="none"><path d="M8 3h8l1 3-1 2H8L7 6l1-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 8L5 9l1 4 2-1v9h8v-9l2 1 1-4-3-1" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  bars: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  coin: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5v9M9.3 9.3c0-1.1 1.2-2 2.7-2s2.7.7 2.7 1.7c0 2.3-5.4 1-5.4 3.3 0 1 1.2 1.7 2.7 1.7s2.7-.9 2.7-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  download: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-3.5-3.5M12 15l3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10v5a5 5 0 01-10 0V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5H4v2a3 3 0 003 3M17 5h3v2a3 3 0 01-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 14v3m-3 3h6m-6 0c0-1.5.9-2.2 3-2.2s3 .7 3 2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

state.section = state.section || 'prepara';
state.prepareView = state.prepareView || 'listone';
state.giornoView = state.giornoView || 'live';

/* stessi 5 contenuti di SECTIONS, in un solo elenco piatto — usato dalla
   barra laterale desktop, che non replica il doppio livello sezione/vista. */
const RAIL_ITEMS = [
  { section: 'prepara', view: 'listone', label: 'Listone', icon: 'shirt' },
  { section: 'prepara', view: 'stats', label: 'Statistiche', icon: 'bars' },
  { section: 'giorno', view: 'live', label: 'Asta live', icon: 'coin' },
  { section: 'giorno', view: 'pagella', label: 'Pagella', icon: 'trophy' },
  { section: 'giorno', view: 'export', label: 'Esporta PDF', icon: 'download' },
];

function currentViewKey() {
  return state.section === 'prepara' ? state.prepareView : state.giornoView;
}
function setCurrentViewKey(v) {
  if (state.section === 'prepara') state.prepareView = v;
  else state.giornoView = v;
}

function goTo(section, view) {
  state.section = section;
  setCurrentViewKey(view);
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === section));
  try { window.scrollTo(0, 0); } catch (e) { /* jsdom / older browsers */ }
  renderShell();
}

/* mini pagella dinamica, sempre visibile sotto la navigazione desktop:
   si aggiorna a ogni acquisto, senza dover aprire la vista Pagella. */
function railPagelleHtml() {
  if (!state.teams.length) return '';
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)]
    .map(t => Object.assign({ team: t }, teamKpis(t.id)))
    .sort((a, b) => b.overall - a.overall);
  const rows = ordered.map((row, idx) => `
    <button class="rail-pagelle-row${row.team.isMine ? ' is-mine' : ''}" data-goto-pagella type="button">
      <span class="rail-pagelle-rank">${idx + 1}</span>
      <span class="rail-pagelle-name">${row.team.isMine ? '★ ' : ''}${escapeAttr(row.team.name)}</span>
      <span class="rail-pagelle-voto">${Math.round(row.overall)}<small>/100</small></span>
    </button>`).join('');
  return `
    <div class="rail-pagelle">
      <div class="rail-pagelle-head">Pagella live</div>
      ${rows}
    </div>`;
}

function renderSideRail() {
  const rail = document.getElementById('side-rail');
  if (!rail) return;
  const viewKey = currentViewKey();
  rail.innerHTML = RAIL_ITEMS.map(item => `
    <button class="rail-btn ${state.section === item.section && viewKey === item.view ? 'active' : ''}" data-section="${item.section}" data-view="${item.view}" type="button">
      ${NAV_ICONS[item.icon]}<span>${item.label}</span>
    </button>`).join('') + railPagelleHtml();
  rail.querySelectorAll('.rail-btn').forEach(btn => {
    btn.addEventListener('click', () => goTo(btn.dataset.section, btn.dataset.view));
  });
  rail.querySelectorAll('[data-goto-pagella]').forEach(btn => {
    btn.addEventListener('click', () => goTo('giorno', 'pagella'));
  });
}

function renderShell() {
  const app = document.getElementById('app');
  const section = SECTIONS[state.section];
  const viewKey = currentViewKey();

  const subnavHtml = Object.keys(section.views).map(k => {
    const v = section.views[k];
    return `<button class="subnav-btn ${viewKey === k ? 'active' : ''}" data-view="${k}">${NAV_ICONS[v.icon]}<span>${v.label}</span></button>`;
  }).join('');

  app.innerHTML = `<div class="subnav-row">${subnavHtml}</div><div id="view-root"></div>`;

  app.querySelectorAll('.subnav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setCurrentViewKey(btn.dataset.view);
      renderShell();
    });
  });

  section.views[viewKey].render();
  renderSideRail();
  renderTeamPanel();
}

function switchSection(section) {
  state.section = section;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === section));
  try { window.scrollTo(0, 0); } catch (e) { /* jsdom / older browsers */ }
  renderShell();
}

function initNav() {
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.section));
  });
  const pill = document.getElementById('budget-pill');
  if (pill) pill.addEventListener('click', openTeamPanelSheet);
}

function init() {
  loadState();
  applyTheme(state.theme);
  wireThemeSwitch();
  initNav();
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.section === state.section));
  renderShell();
}

document.addEventListener('DOMContentLoaded', init);

document.getElementById('header-count').innerHTML = '<b>' + PLAYERS_CURRENT.length + '</b><span>giocatori nel listone</span>';
</script>
