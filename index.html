<style>
/* =========================================================
   FantAsta 26/27 — design system
   Ispirato al tabellone di uno stadio in notturna:
   verde campo profondo, luci allo stadio, cartellini.
   ========================================================= */

:root {
  --bg: #0a1d15;
  --bg-2: #0e2419;
  --panel: #123326;
  --panel-2: #163b2b;
  --line: rgba(242,245,241,0.09);
  --line-strong: rgba(242,245,241,0.16);
  --ink: #f2f5f1;
  --ink-dim: #a9c2b3;
  --ink-faint: #6f8a7c;
  --turf: #2e8b57;
  --turf-bright: #3fae6e;
  --gold: #e3b341;
  --gold-ink: #2a2107;
  --card-red: #d64545;
  --bench: #5b6b63;
  /* ---------- disciplina colori ----------
     ogni colore ha UN significato, ovunque compaia:
     --gold      = fascia Top + risalto brand/numeri (mai "mia squadra")
     --turf-bright = "è nella mia squadra", ovunque (card, gestione squadre, sheet)
     --tier-*    = famiglia propria per le 4 fasce, non si sovrappone a oro/verde
     --setpiece-* = badge rigoristi/piazzati, famiglia blu, non è una fascia */
  --tier-buono: #3aa08f;
  --tier-scommessa: #cf7a42;
  --setpiece-rig: #6fa3e0;
  --setpiece-rig-primary: #3d7dc9;
  --setpiece-piaz: #7cc0ee;
  --gold-soft: #f0c463;
  --role-c: #5aa9e6;
  --role-a-ink: #ef8686;
  --radius-card: 14px;
  --radius-chip: 999px;
  --font-display: 'Oswald', sans-serif;
  --font-body: 'Inter', sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* =========================================================
   Direzioni visive — tre temi selezionabili (vedi selettore
   in testata). "a" è l'identità originale ed è il default:
   il blocco :root sopra la rappresenta già, così l'app resta
   identica a se stessa finché non si cambia tema. I blocchi
   qui sotto ridefiniscono SOLO i token — ogni componente
   dell'app li consuma via var(), quindi il cambio è automatico.
   ========================================================= */

[data-theme="b"] {
  /* Sala Stampa — chiaro, editoriale, verde bosco + oro spento */
  --bg: #f5f1e5; --bg-2: #efe9d8; --panel: #ffffff; --panel-2: #faf6ea;
  --line: rgba(29,42,32,0.12); --line-strong: rgba(29,42,32,0.24);
  --ink: #1d2a20; --ink-dim: #5e6b5f; --ink-faint: #8a9488;
  --turf: #1f6b46; --turf-bright: #2c8a5c;
  --gold: #a5751c; --gold-soft: #c99a3c; --gold-ink: #fffaf0;
  --card-red: #b83d3d; --bench: #6b6248;
  --tier-buono: #1f7a68; --tier-scommessa: #a6642a;
  --setpiece-rig: #3f6fa8; --setpiece-rig-primary: #2c5686; --setpiece-piaz: #5f8fc4;
  --role-c: #3f6fa8; --role-a-ink: #a6432f;
  --radius-card: 6px; --radius-chip: 4px;
  --font-display: 'Fraunces', serif; --font-body: 'Inter', sans-serif;
}

[data-theme="c"] {
  /* Diretta Neon — nero da studio TV, oro acceso, bagliori verdi */
  --bg: #050c08; --bg-2: #08120d; --panel: #0c1913; --panel-2: #102319;
  --line: rgba(120,255,190,0.16); --line-strong: rgba(120,255,190,0.3);
  --ink: #f2fff7; --ink-dim: #8fb3a0; --ink-faint: #5f8271;
  --turf: #0c6b3c; --turf-bright: #2be587;
  --gold: #ffcf4d; --gold-soft: #ffdf85; --gold-ink: #241a00;
  --card-red: #ff5c5c; --bench: #4d6b5b;
  --tier-buono: #22c99e; --tier-scommessa: #e07030;
  --setpiece-rig: #4dc4ff; --setpiece-rig-primary: #2296d6; --setpiece-piaz: #7cd8ff;
  --role-c: #4dc4ff; --role-a-ink: #ff8a8a;
  --radius-card: 12px; --radius-chip: 8px;
  --font-display: 'Barlow Condensed', sans-serif; --font-body: 'Inter', sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: radial-gradient(120% 90% at 50% -10%, color-mix(in srgb, var(--bg) 80%, white 12%) 0%, var(--bg) 55%, color-mix(in srgb, var(--bg) 85%, black 18%) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: calc(78px + var(--safe-bottom));
}

::selection { background: var(--gold); color: var(--gold-ink); }

input, select, button { font-family: inherit; }

/* subtle pitch-line texture behind everything */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent 0 78px, rgba(242,245,241,0.018) 78px 79px),
    repeating-linear-gradient(90deg, transparent 0 78px, rgba(242,245,241,0.018) 78px 79px);
}

/* ---------- header ---------- */

.top-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 94%, transparent) 80%, color-mix(in srgb, var(--bg) 70%, transparent) 100%);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 36px; height: 36px; flex: none;
  border-radius: 50%;
  background: var(--panel-2);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px color-mix(in srgb, var(--gold) 18%, transparent), 0 2px 8px rgba(0,0,0,0.4);
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.brand-word {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14.5px;
  letter-spacing: 0.01em;
  line-height: 1.15;
  white-space: nowrap;
}
.brand-sub { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; letter-spacing: 0.02em; font-family: var(--font-display); }
.brand-sub b { color: var(--gold); font-weight: 700; }

.header-stat {
  font-family: var(--font-display);
  text-align: right;
  line-height: 1.05;
}
.header-stat b { display: block; font-size: 17px; color: var(--gold); }
.header-stat span { font-size: 9.5px; color: var(--ink-dim); font-family: var(--font-body); letter-spacing: 0.02em; }

/* ---------- selettore direzione grafica ---------- */

.theme-switch { position: relative; flex: none; }
.theme-switch-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  color: var(--ink-dim); display: flex; align-items: center; justify-content: center;
}
.theme-switch-btn:hover { color: var(--gold); border-color: var(--gold); }
.theme-switch-menu {
  position: absolute; top: calc(100% + 8px); left: 0;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-card);
  padding: 8px; width: 208px; z-index: 40;
  box-shadow: 0 12px 28px rgba(0,0,0,0.35);
  display: flex; flex-direction: column; gap: 3px;
}
.theme-switch-menu[hidden] { display: none; }
.theme-switch-label {
  font-family: var(--font-display); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-faint); padding: 4px 8px 6px;
}
.theme-swatch {
  display: flex; align-items: center; gap: 10px;
  background: none; border: 1px solid transparent; border-radius: 9px;
  padding: 8px 9px; font-family: var(--font-body); font-size: 13px; color: var(--ink);
  text-align: left; width: 100%;
}
.theme-swatch:hover { background: var(--panel-2); }
.theme-swatch.active { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); font-weight: 600; }
.theme-swatch-dot {
  width: 18px; height: 18px; border-radius: 50%; flex: none;
  border: 1px solid rgba(0,0,0,0.2);
}
.theme-swatch-a { background: linear-gradient(135deg, #0a1d15 50%, #e3b341 50%); }
.theme-swatch-b { background: linear-gradient(135deg, #f5f1e5 50%, #a5751c 50%); }
.theme-swatch-c { background: linear-gradient(135deg, #050c08 50%, #ffcf4d 50%); }

@media (min-width: 860px) {
  .theme-switch-menu { left: auto; right: 0; }
}

/* ---------- main content ---------- */

#app {
  position: relative;
  z-index: 1;
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 16px 24px;
}

.tab-head h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 26px;
  margin: 4px 0 2px;
  letter-spacing: 0.01em;
}
.tab-sub { color: var(--ink-dim); font-size: 13.5px; margin: 0 0 16px; line-height: 1.4; }

.section-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  margin: 22px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

/* ---------- segmented role control ---------- */

.seg-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 12px;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.seg-row::-webkit-scrollbar { display: none; }

.seg-btn {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 9px 14px;
  border-radius: 11px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-body);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.seg-btn.active {
  background: var(--turf);
  border-color: var(--turf-bright);
  color: #ffffff;
}
.seg-count {
  font-size: 10.5px;
  background: rgba(0,0,0,0.22);
  border-radius: 999px;
  padding: 1px 6px;
}
.seg-btn.active .seg-count { background: rgba(255,255,255,0.22); }

/* ---------- filter bar ---------- */

.filter-bar {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.filter-bar input[type="search"],
.filter-bar select,
.budget-row input {
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  border-radius: 9px;
  padding: 10px 12px;
  font-size: 14px;
  width: 100%;
}
.filter-bar input[type="search"]::placeholder { color: var(--ink-faint); }
.filter-row-2 { display: flex; gap: 8px; align-items: center; }
.filter-row-2 select { flex: 1; min-width: 0; }
.switch-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--ink-dim);
  white-space: nowrap;
}

/* ---------- tier chips ---------- */

.tier-chip-row { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
.tier-chip-row::-webkit-scrollbar { display: none; }
.chip-filter {
  flex: none;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 7px 12px;
  border-radius: var(--radius-chip);
  font-size: 12.5px;
  font-weight: 600;
}
.chip-filter.active { color: var(--bg); }
.chip-filter.tier-top.active { background: var(--gold); border-color: var(--gold); }
.chip-filter.tier-buono.active { background: var(--tier-buono); border-color: var(--tier-buono); color: #fff; }
.chip-filter.tier-scommessa.active { background: var(--tier-scommessa); border-color: var(--tier-scommessa); color: #fff; }
.chip-filter.tier-ultime.active { background: var(--bench); border-color: var(--bench); color: #fff; }
.chip-filter:not(.tier-top):not(.tier-buono):not(.tier-scommessa):not(.tier-ultime).active {
  background: var(--ink); color: var(--bg);
}

/* ---------- tier sections ---------- */

.tier-section { margin-bottom: 20px; }
.tier-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  padding: 8px 2px;
  border-bottom: 2px solid var(--line-strong);
}
.tier-head.tier-top { color: var(--gold); border-bottom-color: var(--gold); }
.tier-head.tier-buono { color: var(--tier-buono); border-bottom-color: var(--tier-buono); }
.tier-head.tier-scommessa { color: var(--tier-scommessa); border-bottom-color: var(--tier-scommessa); }
.tier-head.tier-ultime { color: var(--bench); border-bottom-color: var(--bench); }
.tier-count { font-size: 12px; color: var(--ink-dim); font-family: var(--font-body); }
.tier-desc { font-size: 12px; color: var(--ink-dim); margin: 6px 2px 10px; }

.tier-dot {
  width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 5px;
}
.tier-dot.tier-top { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.tier-dot.tier-buono { background: var(--tier-buono); }
.tier-dot.tier-scommessa { background: var(--tier-scommessa); }
.tier-dot.tier-ultime { background: var(--bench); }

/* ---------- player cards ---------- */

.p-list, .p-list-inner { display: flex; flex-direction: column; gap: 8px; }

.p-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 12px 13px;
}
.p-card.is-mine { border-color: var(--turf-bright); box-shadow: 0 0 0 1px var(--turf-bright) inset; }
.p-card.is-other { opacity: 0.45; }

.p-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.p-card-id { display: flex; gap: 9px; align-items: flex-start; min-width: 0; }
.p-name { font-weight: 600; font-size: 15px; line-height: 1.25; }
.p-team { font-size: 12px; color: var(--ink-dim); }

.p-price { text-align: right; flex: none; }
.p-fvm { font-family: var(--font-display); font-size: 19px; color: var(--gold); line-height: 1; }
.p-fvm i { display: block; font-style: normal; font-size: 9px; color: var(--ink-faint); letter-spacing: 0.04em; }
.p-qta { font-size: 11.5px; color: var(--ink-dim); margin-top: 3px; }

.role-pill {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 600;
  padding: 3px 7px;
  border-radius: 6px;
  flex: none;
  margin-top: 1px;
  letter-spacing: 0.02em;
}
.role-P { background: color-mix(in srgb, var(--gold) 18%, transparent); color: var(--gold); }
.role-D { background: color-mix(in srgb, var(--turf-bright) 18%, transparent); color: var(--turf-bright); }
.role-C { background: color-mix(in srgb, var(--role-c) 18%, transparent); color: var(--role-c); }
.role-A { background: color-mix(in srgb, var(--card-red) 18%, transparent); color: var(--role-a-ink); }

.p-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600;
  padding: 3px 8px;
  border-radius: var(--radius-chip);
}
.chip-rig { background: color-mix(in srgb, var(--setpiece-rig) 16%, transparent); color: var(--setpiece-rig); }
.chip-piaz { background: color-mix(in srgb, var(--setpiece-piaz) 16%, transparent); color: var(--setpiece-piaz); }
.ic-mini { width: 12px; height: 12px; }

/* rigorista designato n.1: evidenziazione forte, distinta dagli altri incaricati —
   famiglia blu (informazione tattica), mai oro: l'oro qui vorrebbe dire "fascia Top". */
.chip-rig-primary {
  background: linear-gradient(135deg, var(--setpiece-rig-primary), var(--setpiece-rig));
  color: #f2f5f1;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--setpiece-rig-primary) 50%, transparent), 0 2px 6px color-mix(in srgb, var(--setpiece-rig-primary) 35%, transparent);
}
.p-card.is-rig-primary {
  border-color: var(--setpiece-rig-primary);
  box-shadow: 0 0 0 1px var(--setpiece-rig-primary) inset;
  background: linear-gradient(180deg, color-mix(in srgb, var(--setpiece-rig-primary) 10%, transparent), var(--panel) 55%);
}

.p-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line-strong);
}
.stat { display: flex; flex-direction: column; align-items: flex-start; min-width: 26px; }
.stat b { font-family: var(--font-display); font-size: 14.5px; line-height: 1.1; }
.stat i { font-style: normal; font-size: 9.5px; color: var(--ink-faint); letter-spacing: 0.03em; margin-top: 1px; }
.stat.hl b { color: var(--turf-bright); }
.stat-new { font-size: 12px; color: var(--ink-faint); font-style: italic; align-self: center; }

.p-status-btn {
  margin-top: 10px;
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  color: var(--ink-dim);
  border-radius: 9px;
  padding: 9px;
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.p-card.is-mine .p-status-btn { color: var(--turf-bright); border-color: var(--turf-bright); }
.p-card.is-other .p-status-btn { color: var(--card-red); border-color: var(--card-red); }
.ic { width: 15px; height: 15px; }

.empty-state {
  text-align: center;
  color: var(--ink-faint);
  padding: 40px 16px;
  font-size: 14px;
}

/* ---------- budget card (asta live) ---------- */

.budget-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 14px;
  margin-bottom: 16px;
}
.budget-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.budget-row label { font-size: 13px; color: var(--ink-dim); }
.budget-row input { width: 90px; text-align: right; }
.budget-bar-wrap { margin-bottom: 14px; }
.budget-bar { height: 10px; background: var(--bg-2); border-radius: 999px; overflow: hidden; }
.budget-bar-fill { height: 100%; background: linear-gradient(90deg, var(--turf), var(--tier-scommessa)); border-radius: 999px; transition: width 0.4s ease; }
.budget-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
.budget-legend b { color: var(--ink); font-family: var(--font-display); }

.budget-role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.budget-role { display: flex; align-items: center; gap: 8px; background: var(--bg-2); border-radius: 9px; padding: 8px 10px; }
.budget-role-nums { display: flex; flex-direction: column; font-size: 12px; }
.budget-role-nums .dim { color: var(--ink-faint); font-size: 10.5px; }

.rosa-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  align-items: start;
}
@media (max-width: 380px) {
  .rosa-columns { grid-template-columns: 1fr; }
}
.rosa-col-title {
  font-family: var(--font-display);
  font-size: 14px;
  color: var(--ink-dim);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ---------- season toggle (Statistiche tab) ---------- */

.season-toggle-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.season-toggle-btn {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 11px;
  padding: 10px 12px;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}
.season-toggle-btn.active { background: var(--turf); border-color: var(--turf-bright); color: #fff; }
.season-toggle-sub {
  font-family: var(--font-body);
  font-size: 10px;
  font-weight: 500;
  color: var(--ink-dim);
  letter-spacing: 0.01em;
}
.season-toggle-btn.active .season-toggle-sub { color: rgba(255,255,255,0.75); }

/* ---------- season blocks inside a listone card (25/26 vs 26/27 ben divisi) ---------- */

.season-block {
  margin-top: 10px;
  padding-top: 9px;
  border-top: 1px dashed var(--line-strong);
}
.season-block:first-of-type { margin-top: 10px; }
.season-label {
  font-family: var(--font-display);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.season-block-curr .season-label { color: var(--turf-bright); }
.season-live-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--turf-bright);
  box-shadow: 0 0 5px var(--turf-bright);
  flex: none;
}
.season-empty { font-size: 11.5px; color: var(--ink-faint); font-style: italic; }

.mini-role-head {
  font-family: var(--font-display);
  font-size: 13.5px;
  color: var(--ink-dim);
  margin: 12px 0 6px;
  display: flex; gap: 8px; align-items: center;
}
.mini-role-head:first-child { margin-top: 0; }
.mini-role-head span { font-size: 11px; color: var(--ink-faint); }

.roster-row {
  display: flex; align-items: center; gap: 9px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px;
  margin-bottom: 6px;
}
.roster-info { flex: 1; min-width: 0; }
.roster-info .p-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster-info .p-team { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roster-price { font-family: var(--font-display); font-size: 17px; font-weight: 600; color: var(--gold); flex: none; }
.roster-remove { background: none; border: none; color: var(--ink-faint); padding: 4px; flex: none; }
.roster-row .role-pill { font-size: 11px; padding: 3px 6px; }

/* ---------- gestione squadre (setup) ---------- */

.teams-setup-list { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 12px; }
.team-setup-row {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--line-strong);
  border-radius: 10px; padding: 8px 9px;
}
.team-setup-row.is-mine { border-color: var(--turf-bright); background: color-mix(in srgb, var(--turf-bright) 8%, transparent); }
.team-star-btn {
  background: none; border: none; font-size: 18px; line-height: 1;
  color: var(--ink-faint); padding: 4px; flex: none;
}
.team-star-btn.active { color: var(--turf-bright); }
.team-name-input {
  flex: 1; min-width: 0;
  background: transparent; border: none; border-bottom: 1px solid var(--line-strong);
  color: var(--ink); font-size: 14px; padding: 4px 2px;
}
.team-name-input:focus { outline: none; border-bottom-color: var(--turf-bright); }
.team-remove-btn { background: none; border: none; color: var(--ink-faint); padding: 4px; flex: none; }

.btn-secondary {
  width: 100%;
  background: var(--bg-2);
  border: 1px dashed var(--line-strong);
  color: var(--ink-dim);
  padding: 10px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 13.5px;
  margin-top: 4px;
}

/* ---------- riepilogo crediti per squadra ---------- */

.budget-overview-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.team-budget-row {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 11px; padding: 10px 12px;
}
.team-budget-row.is-mine { border-color: var(--turf-bright); background: linear-gradient(180deg, color-mix(in srgb, var(--turf-bright) 8%, transparent), var(--panel) 60%); }
.team-budget-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; gap: 8px; }
.team-budget-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.team-budget-nums { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; text-align: right; }
.team-budget-nums b { color: var(--gold); font-family: var(--font-display); font-size: 18px; font-weight: 600; }

.empty-state-mini { font-size: 12.5px; color: var(--ink-faint); padding: 10px 2px; text-align: center; }

.scroll-top-btn {
  position: fixed;
  right: 16px;
  bottom: calc(78px + var(--safe-bottom, 0px));
  z-index: 40;
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--gold);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
}
.scroll-top-btn svg { width: 20px; height: 20px; }
@media (min-width: 980px) { .scroll-top-btn { bottom: 24px; } }

/* ---------- team picker (bottom sheet) ---------- */

.sheet-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end;
}
.sheet {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 10px 16px calc(20px + var(--safe-bottom));
  max-height: 80vh;
  overflow-y: auto;
}
.sheet-handle { width: 36px; height: 4px; background: var(--line-strong); border-radius: 999px; margin: 4px auto 14px; }
.sheet-title { font-family: var(--font-display); font-size: 17px; margin-bottom: 2px; }
.sheet-title b { color: var(--gold); }
.sheet-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 14px; }
.sheet-teams { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.sheet-team-btn {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-2); border: 1px solid var(--line-strong);
  border-radius: 11px; padding: 12px 14px;
  color: var(--ink); text-align: left;
}
.sheet-team-btn.is-mine { border-color: var(--turf-bright); background: color-mix(in srgb, var(--turf-bright) 9%, transparent); }
.sheet-team-btn.is-current { box-shadow: 0 0 0 2px var(--turf-bright) inset; }
.sheet-team-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; }
.sheet-team-budget { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--turf-bright); flex: none; margin-left: 10px; text-align: right; white-space: nowrap; }
.sheet-free-btn {
  width: 100%; background: color-mix(in srgb, var(--card-red) 12%, transparent); border: 1px solid var(--card-red);
  color: var(--card-red); padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px; margin-bottom: 8px;
}
.sheet-cancel-btn {
  width: 100%; background: none; border: 1px solid var(--line-strong);
  color: var(--ink-dim); padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
}

.mark-btn {
  border-radius: 8px; border: 1px solid var(--line-strong);
  padding: 7px 10px; font-size: 12.5px; font-weight: 600;
  background: var(--bg-2); color: var(--ink-dim);
}
.mark-mine { color: var(--turf-bright); border-color: var(--turf-bright); }
.mark-other { color: var(--card-red); border-color: var(--card-red); width: 100%; }

/* ---------- export tab ---------- */

.export-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 16px;
  margin-bottom: 12px;
}
.export-card-title { font-family: var(--font-display); font-size: 16.5px; margin-bottom: 6px; }
.export-card-desc { font-size: 13px; color: var(--ink-dim); line-height: 1.45; margin: 0 0 12px; }
.btn-primary {
  background: var(--turf);
  border: 1px solid var(--turf-bright);
  color: #fff;
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 14px;
  width: 100%;
}
.btn-primary:active { background: var(--turf-bright); }
.export-note { font-size: 11.5px; color: var(--ink-faint); text-align: center; margin-top: 18px; line-height: 1.5; }
.kiosk-head { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
.export-card-kiosk .btn-secondary { margin-top: 0; }
#kiosk-status { min-height: 16px; }
#kiosk-status.kiosk-status-error { color: var(--card-red); }

/* ---------- bottom nav ---------- */

.bottom-nav {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + var(--safe-bottom));
}
.nav-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-dim);
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 6px;
  margin: 0 3px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-display);
  letter-spacing: 0.01em;
  border-radius: 12px;
}
.nav-btn svg { width: 20px; height: 20px; flex: none; }
.nav-btn.active { color: var(--bg); background: linear-gradient(135deg, var(--gold), var(--gold-soft)); }

/* ---------- sub-navigation (within a section) ---------- */

.subnav-row {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 4px;
}
.subnav-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--ink-dim);
  padding: 10px 8px;
  font-size: 13.5px;
  font-weight: 600;
  font-family: var(--font-body);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.subnav-btn.active { background: var(--turf); color: #fff; }
.subnav-btn svg { width: 16px; height: 16px; }

/* ---------- collapsible mega-section (Listone) ---------- */

.mega-section { margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; background: var(--panel); }
.mega-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel-2);
  border: none;
  color: var(--ink);
  padding: 13px 14px;
  font-family: var(--font-display);
  font-size: 15.5px;
  font-weight: 600;
}
.mega-head .mega-sub { font-size: 11px; color: var(--ink-dim); font-family: var(--font-body); font-weight: 500; display: block; margin-top: 2px; }
.mega-head .chev { width: 16px; height: 16px; transition: transform 0.2s ease; flex: none; }
.mega-section.collapsed .chev { transform: rotate(-90deg); }
.mega-body { padding: 12px; }
.mega-section.collapsed .mega-body { display: none; }

/* ---------- griglia portieri (coppie consigliate) ---------- */

.pair-section-label {
  font-family: var(--font-display);
  font-size: 12.5px;
  font-weight: 600;
  margin: 14px 0 8px;
  letter-spacing: 0.02em;
}
.pair-section-label.pair-section-good { color: var(--turf-bright); }
.pair-section-label.pair-section-bad { color: var(--card-red); }
.pair-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.pair-card {
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-left: 3px solid var(--line-strong);
  border-radius: 10px;
  padding: 10px 12px;
}
.pair-card.pair-good { border-left-color: var(--turf-bright); }
.pair-card.pair-bad { border-left-color: var(--card-red); }
.pair-teams {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: 13.5px;
  font-weight: 600;
}
.pair-keepers { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
.pair-keeper { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
.pair-keeper .p-name { font-size: 13px; }
.pair-keeper .p-team { font-size: 11.5px; }
.pair-keeper-missing { font-size: 11.5px; color: var(--ink-faint); font-style: italic; }
.pair-note { font-size: 11px; color: var(--ink-dim); margin: 8px 0 0; }

/* ---------- pagella: classifica di lega + archivio stagioni ---------- */

.pagella-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.pagella-row {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center;
  gap: 4px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  padding: 12px 14px;
}
.pagella-row.is-mine { border-color: var(--turf-bright); background: linear-gradient(180deg, color-mix(in srgb, var(--turf-bright) 8%, transparent), var(--panel) 60%); }
.pagella-rank { font-family: var(--font-display); font-size: 15px; color: var(--ink-faint); text-align: center; }
.pagella-row:first-child .pagella-rank { color: var(--gold); }
.pagella-id { min-width: 0; }
.pagella-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pagella-sub { font-size: 11.5px; color: var(--ink-dim); margin: 3px 0 6px; }
.pagella-voto { text-align: right; flex: none; }
.pagella-voto-num { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--gold); line-height: 1; }
.pagella-voto-suffix { font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--ink-faint); margin-left: 1px; }
.pagella-voto-label { font-size: 10.5px; color: var(--ink-dim); margin-top: 2px; white-space: nowrap; }
.pagella-kpis { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-dim); margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }

.archive-controls { display: flex; gap: 8px; margin: 10px 0 14px; flex-wrap: wrap; }
.archive-controls input {
  flex: 1; min-width: 140px;
  background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 10px;
  padding: 9px 12px; color: var(--ink); font-size: 13px; font-family: var(--font-body);
}
.archive-entry { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; margin-bottom: 8px; overflow: hidden; }
.archive-entry-head { display: flex; align-items: stretch; }
.archive-toggle-btn { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: none; color: var(--ink); padding: 11px 12px; text-align: left; }
.archive-entry-title { font-family: var(--font-display); font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.archive-entry-sub { font-size: 11px; color: var(--ink-dim); }
.archive-delete-btn { flex: none; width: 40px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ink-faint); }
.archive-delete-btn:hover { color: var(--card-red); }
.archive-entry-body { display: none; padding: 0 12px 12px; border-top: 1px solid var(--line); }
.archive-entry.open .archive-entry-body { display: block; padding-top: 8px; }
.archive-mini-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-dim); padding: 5px 0; }
.archive-mini-row span:first-child { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.archive-mini-row span:last-child { flex: none; white-space: nowrap; }

/* ---------- pillola budget in testata (mobile: apre il pannello squadra) ---------- */

.budget-pill {
  display: flex; align-items: baseline; gap: 4px; flex: none;
  background: var(--panel-2); border: 1px solid var(--line-strong);
  border-radius: var(--radius-chip);
  padding: 7px 12px; margin-left: 8px;
  font-family: var(--font-display);
}
.budget-pill b { color: var(--gold); font-size: 17px; }
.budget-pill span { font-size: 10.5px; color: var(--ink-dim); margin-left: 2px; }

/* ---------- layout a 3 zone (desktop) / colonna singola (mobile, invariata) ---------- */

.layout-shell { position: relative; z-index: 1; }
.side-rail { display: none; }
.team-panel { display: none; }

/* ---------- pannello squadra: contenuto condiviso desktop/mobile ---------- */

.panel-head { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px; }
.panel-team-name { font-family: var(--font-display); font-size: 15px; color: var(--turf-bright); margin-bottom: 8px; }
.panel-budget-big { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.panel-budget-big b { font-family: var(--font-display); font-size: 30px; color: var(--gold); line-height: 1; }
.panel-budget-big span { font-size: 11.5px; color: var(--ink-dim); }
.panel-mini-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-dim); margin-top: 10px; }
.panel-mini-stats b { color: var(--ink); font-family: var(--font-display); }

.panel-undo {
  width: 100%; margin-top: 10px; background: color-mix(in srgb, var(--turf-bright) 10%, transparent); border: 1px solid var(--turf-bright);
  color: var(--turf-bright); padding: 9px; border-radius: 10px; font-weight: 600; font-size: 12.5px;
}

.panel-tabs { display: flex; gap: 6px; margin: 14px 0 10px; }
.panel-tab {
  flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim);
  padding: 8px 6px; font-size: 11.5px; font-weight: 600; border-radius: 9px; font-family: var(--font-body);
}
.panel-tab.active { background: var(--turf); border-color: var(--turf); color: #fff; }

/* ---------- piani di divisione crediti: selettore + dettaglio slot ---------- */

.plan-switcher { margin-bottom: 12px; }
.plan-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-chip {
  background: var(--panel); border: 1px solid var(--line-strong); color: var(--ink-dim);
  padding: 6px 11px; font-size: 11.5px; font-weight: 600; border-radius: var(--radius-chip); font-family: var(--font-body);
}
.plan-chip.active { background: var(--turf); border-color: var(--turf); color: #fff; }
.plan-chip-add { color: var(--gold); border-style: dashed; }
.plan-manage-row { display: flex; gap: 8px; margin-top: 8px; }
.plan-manage-row input {
  flex: 1; min-width: 0; background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 9px;
  padding: 7px 10px; color: var(--ink); font-size: 12.5px; font-family: var(--font-body);
}
.plan-delete-btn { flex: none; width: 32px; display: flex; align-items: center; justify-content: center; background: none; border: 1px solid var(--line-strong); border-radius: 9px; color: var(--ink-faint); }
.plan-delete-btn:hover { color: var(--card-red); border-color: var(--card-red); }
.plan-hint { font-size: 11px; color: var(--ink-faint); margin: 8px 0 0; line-height: 1.4; }
.plan-warning { font-size: 11px; color: var(--tier-scommessa); margin: 8px 0 0; line-height: 1.4; }

.planner-rows { display: flex; flex-direction: column; gap: 10px; }
.planner-row-wrap { display: flex; flex-direction: column; }
.planner-row { display: flex; align-items: center; gap: 10px; }
.planner-mid { flex: 1; min-width: 0; }
.planner-bar { height: 7px; background: var(--bg-2); border-radius: 999px; overflow: hidden; margin-bottom: 4px; }
.planner-bar-fill { height: 100%; background: var(--turf-bright); border-radius: 999px; transition: width 0.3s ease; }
.planner-bar-fill.over { background: var(--card-red); }
.planner-nums { font-size: 11px; color: var(--ink-dim); }
.planner-nums b { color: var(--ink); font-family: var(--font-display); }
.planner-nums-main { font-size: 13px; margin-bottom: 4px; }
.planner-nums-main b { font-size: 14px; }
.planner-nums-pct { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.planner-pct-tag { font-size: 11.5px; color: var(--ink-dim); }
.planner-pct-tag b { color: var(--ink); font-family: var(--font-display); font-size: 13px; }
.planner-pct-tag-real b { color: var(--gold); }
.planner-real-pct { color: var(--ink-faint); }
.planner-pct-input {
  width: 38px; background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 2px 3px; color: var(--ink); font-size: 13px; font-weight: 600; text-align: center; font-family: var(--font-display);
}
.planner-expand-btn { flex: none; background: none; border: none; color: var(--ink-faint); padding: 4px; }
.planner-expand-btn .chev { width: 14px; height: 14px; transform: rotate(-90deg); transition: transform 0.2s ease; }
.planner-expand-btn .chev.open { transform: rotate(0deg); }
.slot-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; }
.slot-row {
  display: grid; grid-template-columns: 36px 1fr 1fr; align-items: center; gap: 10px;
  background: var(--bg-2); border-radius: 9px; padding: 8px 10px;
}
.slot-label { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--ink-faint); }
.slot-figure { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.slot-figure-cap { font-size: 9.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; }
.slot-figure-val {
  font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.slot-figure-val .slot-input {
  width: 48px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px;
  padding: 2px 4px; color: var(--ink); font-size: 14px; font-family: var(--font-display); margin-right: 3px;
}
.slot-row:not(.is-bought) .slot-figure-paid { color: var(--ink-faint); font-style: italic; font-weight: 400; font-size: 12.5px; }
.slot-row.is-bought .slot-figure-paid { color: var(--turf-bright); }
.slot-row.is-over .slot-figure-paid { color: var(--card-red); }

.role-TOT { background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--ink); }
.planner-total-wrap { margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line-strong); }

.chimanca-list { display: flex; flex-direction: column; gap: 14px; }
.chimanca-role-head { font-family: var(--font-display); font-size: 12px; color: var(--ink-faint); letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 6px; }
.chimanca-row { display: flex; align-items: center; gap: 8px; padding: 8px 5px; border-radius: 8px; font-size: 13.5px; text-align: left; width: 100%; background: none; border: none; color: var(--ink); }
.chimanca-row:hover { background: var(--panel-2); }
.chimanca-row.is-taken { opacity: 0.4; }
.chimanca-name { font-weight: 600; }
.chimanca-team { color: var(--ink-faint); font-size: 11.5px; flex: 1; }
.chimanca-fvm { font-family: var(--font-display); font-weight: 600; color: var(--gold); font-size: 15px; }
.chimanca-empty { font-size: 12px; color: var(--ink-faint); font-style: italic; padding: 6px 2px; }

/* ---------- preferiti: stella sulle card giocatore ---------- */

.p-fav-btn {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--line-strong); background: var(--bg-2); color: var(--ink-faint);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; line-height: 1;
}
.p-fav-btn.active { color: var(--gold); border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.p-card-right { display: flex; align-items: flex-start; gap: 8px; flex: none; }

/* ---------- stepper prezzo + termometro del mercato ---------- */

.price-step-info { display: flex; gap: 10px; margin-bottom: 16px; }
.price-info-chip { flex: 1; min-width: 0; background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; }
.price-info-cap { display: block; font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.price-info-val { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--ink); }
.price-info-chip.is-warn .price-info-val { color: var(--card-red); }
.price-step { margin: 2px 0 16px; }
.price-step-row { display: flex; align-items: center; gap: 14px; justify-content: center; margin-bottom: 10px; }
.price-step-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line-strong);
  background: var(--bg-2); color: var(--ink); font-family: var(--font-display); font-size: 22px; flex: none;
}
.price-step-btn:active { background: var(--panel-2); }
.price-step-input {
  width: 84px; text-align: center; font-family: var(--font-display); font-size: 28px;
  background: transparent; border: none; border-bottom: 2px solid var(--line-strong); color: var(--gold); padding-bottom: 2px;
}
.price-therm-wrap { text-align: center; margin-bottom: 14px; }
.price-therm { font-size: 12px; padding: 6px 12px; border-radius: 999px; display: inline-flex; font-weight: 600; }
.price-therm.under { background: color-mix(in srgb, var(--turf-bright) 14%, transparent); color: var(--turf-bright); }
.price-therm.over { background: color-mix(in srgb, var(--tier-scommessa) 16%, transparent); color: var(--tier-scommessa); }
.price-therm.even { background: var(--panel-2); color: var(--ink-dim); }
.price-step-actions { display: flex; gap: 8px; }
.price-step-confirm {
  flex: 1; background: var(--turf); border: 1px solid var(--turf); color: #fff;
  padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px;
}

/* ---------- foglio di conferma generico (sostituisce window.confirm) ---------- */

.confirm-sheet-text { font-size: 13.5px; color: var(--ink-dim); margin-bottom: 16px; line-height: 1.5; }
.confirm-sheet-actions { display: flex; gap: 8px; }
.confirm-sheet-danger {
  flex: 1; background: color-mix(in srgb, var(--card-red) 14%, transparent); border: 1px solid var(--card-red); color: var(--card-red);
  padding: 11px; border-radius: 10px; font-weight: 600; font-size: 13.5px;
}

/* ---------- responsive ---------- */

@media (min-width: 480px) {
  .p-stats { gap: 16px; }
}

@media (min-width: 720px) {
  .top-header, #app { max-width: 720px; }
}

/* ---------- desktop: layout a 3 zone, niente più vista mobile ingrandita ---------- */

@media (min-width: 980px) {
  body { padding-bottom: 24px; }
  .budget-pill { display: none; }
  .bottom-nav { display: none; }
  .subnav-row { display: none; }

  .top-header { max-width: 1280px; margin: 0 auto; }

  .layout-shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 22px 24px 40px;
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr) 320px;
    gap: 22px;
    align-items: start;
  }

  .side-rail {
    display: flex; flex-direction: column; gap: 3px;
    position: sticky; top: 88px;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-card);
    padding: 10px;
  }
  .rail-btn {
    display: flex; align-items: center; gap: 11px;
    background: none; border: none; color: var(--ink-dim);
    padding: 12px 13px; border-radius: 9px;
    font-family: var(--font-display); font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    text-align: left;
  }
  .rail-btn svg { width: 18px; height: 18px; flex: none; }
  .rail-btn.active { background: var(--turf); color: #fff; }
  .rail-btn:not(.active):hover { background: var(--panel-2); color: var(--ink); }

  .rail-pagelle { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
  .rail-pagelle-head { font-family: var(--font-display); font-size: 10.5px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.04em; padding: 0 8px 6px; }
  .rail-pagelle-row {
    display: flex; align-items: center; gap: 8px;
    background: none; border: none; color: var(--ink-dim);
    padding: 6px 8px; border-radius: 8px; font-size: 12px; font-family: var(--font-body);
  }
  .rail-pagelle-row:hover { background: var(--panel-2); color: var(--ink); }
  .rail-pagelle-row.is-mine { color: var(--turf-bright); font-weight: 600; }
  .rail-pagelle-rank { flex: none; width: 14px; color: var(--ink-faint); font-family: var(--font-display); font-size: 11px; }
  .rail-pagelle-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  .rail-pagelle-voto { flex: none; font-family: var(--font-display); font-size: 11.5px; color: var(--gold); }
  .rail-pagelle-voto small { font-family: var(--font-body); font-size: 0.78em; font-weight: 400; color: var(--ink-faint); }

  #app { max-width: none; margin: 0; padding: 0; }

  .team-panel {
    display: block;
    position: sticky; top: 88px;
    max-height: calc(100vh - 108px);
    overflow-y: auto;
    padding-right: 2px;
  }

  .p-list, .p-list-inner { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; align-items: start; }
  .filter-bar, .seg-row, .tier-chip-row { max-width: none; }
}

/* =========================================================
   Tocchi di carattere per tema — pochi, mirati, sopra ai
   token: qui il "come" cambia davvero forma, non solo colore.
   ========================================================= */

/* ---------- b: Sala Stampa — piatto, da pagina stampata ---------- */
[data-theme="b"] body { background: var(--bg); }
[data-theme="b"] body::before { display: none; }
[data-theme="b"] .top-header,
[data-theme="b"] .bottom-nav { backdrop-filter: none; background: var(--bg); }
[data-theme="b"] .top-header { border-bottom: 1px solid var(--line-strong); }
[data-theme="b"] .bottom-nav { border-top: 1px solid var(--line-strong); }
[data-theme="b"] .brand-mark { border-radius: 6px; }
[data-theme="b"] .tab-head h1 { font-weight: 600; }
[data-theme="b"] ::selection { background: var(--gold); color: var(--gold-ink); }

/* ---------- c: Diretta Neon — titoli maiuscoli, bagliori sugli accenti ---------- */
[data-theme="c"] body::before {
  background-image:
    repeating-linear-gradient(0deg, transparent 0 78px, color-mix(in srgb, var(--turf-bright) 6%, transparent) 78px 79px),
    repeating-linear-gradient(90deg, transparent 0 78px, color-mix(in srgb, var(--turf-bright) 6%, transparent) 78px 79px);
}
[data-theme="c"] .tab-head h1,
[data-theme="c"] .brand-word,
[data-theme="c"] .section-title { text-transform: uppercase; letter-spacing: 0.02em; }
[data-theme="c"] .brand-mark {
  box-shadow: 0 0 0 2px var(--gold), 0 0 0 4px color-mix(in srgb, var(--gold) 28%, transparent), 0 0 22px color-mix(in srgb, var(--gold) 45%, transparent);
}
[data-theme="c"] .btn-primary,
[data-theme="c"] .nav-btn.active {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--turf-bright) 35%, transparent), 0 0 18px color-mix(in srgb, var(--turf-bright) 35%, transparent);
}
[data-theme="c"] .p-card.is-mine,
[data-theme="c"] .team-budget-row.is-mine,
[data-theme="c"] .team-setup-row.is-mine {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--turf-bright) 45%, transparent), 0 0 16px color-mix(in srgb, var(--turf-bright) 22%, transparent);
}
[data-theme="c"] .pagella-voto-num,
[data-theme="c"] .header-stat b {
  text-shadow: 0 0 16px color-mix(in srgb, var(--gold) 55%, transparent);
}
</style>
</head>
<body>

<header class="top-header">

function uid() {

};

let lastAction = null; // { label, undo() } — un solo livello di annulla, non persistito

function loadState() {
  try {
    const raw = localStorage.getItem(STATE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state = Object.assign({}, state, saved);
    }
  } catch (e) { /* ignore corrupt storage */ }
  if (!state.teams || !state.teams.length) state.teams = [{ id: uid(), name: 'La mia squadra', isMine: true }];
  if (!state.teams.some(t => t.isMine)) state.teams[0].isMine = true;
  if (!state.astaTeamFilter) state.astaTeamFilter = getMyTeam().id;
  if (!Array.isArray(state.favorites)) state.favorites = [];
  if (!Array.isArray(state.budgetPlans)) state.budgetPlans = [];
  if (!state.activePlanId) state.activePlanId = 'consigliato';
  if (!Array.isArray(state.plannerOpenRoles)) state.plannerOpenRoles = [];
  if (state.theme !== 'a' && state.theme !== 'b' && state.theme !== 'c') state.theme = 'a';
}

function saveState() {
  try {
    localStorage.setItem(STATE_KEY, JSON.stringify({
      budgetTotal: state.budgetTotal,
      teams: state.teams,
      assignments: state.assignments,
      favorites: state.favorites,
      budgetPlans: state.budgetPlans,
      activePlanId: state.activePlanId,
      theme: state.theme,
    }));
  } catch (e) { /* storage full or unavailable */ }
}

/* ---------- direzione grafica (tema) ---------- */

const THEME_META = {
  a: { name: 'Notte di San Siro', bg: '#0a1d15' },
  b: { name: 'Sala Stampa', bg: '#f5f1e5' },
  c: { name: 'Diretta Neon', bg: '#050c08' },
};

function applyTheme(themeId) {
  if (!THEME_META[themeId]) themeId = 'a';
  document.documentElement.dataset.theme = themeId;
  state.theme = themeId;
  const metaColor = document.querySelector('meta[name="theme-color"]');
  if (metaColor) metaColor.setAttribute('content', THEME_META[themeId].bg);
  saveState();
  renderThemeSwitch();
}

function renderThemeSwitch() {
  const menu = document.getElementById('theme-switch-menu');
  if (!menu) return;
  menu.querySelectorAll('.theme-swatch').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.themeChoice === state.theme);
  });
}

function wireThemeSwitch() {
  const btn = document.getElementById('theme-switch-btn');
  const menu = document.getElementById('theme-switch-menu');
  if (!btn || !menu) return;
  btn.addEventListener('click', (ev) => {
    ev.stopPropagation();
    menu.hidden = !menu.hidden;
  });
  menu.querySelectorAll('.theme-swatch').forEach(swatchBtn => {
    swatchBtn.addEventListener('click', () => {
      applyTheme(swatchBtn.dataset.themeChoice);
      menu.hidden = true;
    });
  });
  document.addEventListener('click', (ev) => {
    if (!menu.hidden && !menu.contains(ev.target) && ev.target !== btn) menu.hidden = true;
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') menu.hidden = true;
  });
}

/* ---------- preferiti (watchlist) ---------- */

function isFavorite(playerId) {
  return state.favorites.includes(String(playerId));
}
function toggleFavorite(playerId) {
  const id = String(playerId);
  const idx = state.favorites.indexOf(id);
  if (idx === -1) state.favorites.push(id); else state.favorites.splice(idx, 1);
  saveState();
  refreshTeamPanel();
}

/* ---------- helpers ---------- */

function fmt1(n) { return (Math.round(n * 10) / 10).toFixed(1); }
function fmt0(n) { return Math.round(n).toString(); }

/* Il FVM del listone Fantacalcio.it è calcolato su una lega da 1000 crediti:
   con un budget diverso (es. 500) va riproporzionato linearmente, altrimenti
   sembra "gonfiato". Il valore grezzo (p.fvm) resta quello dei dati — usato
   per ordinamenti/rapporti, dove la scala non conta perché è la stessa per
   tutti — questa funzione è solo per quello che viene mostrato a schermo. */
function fvmForBudget(rawFvm) {
  return Math.round(rawFvm * (state.budgetTotal / 1000));
}

function playerSetpieceBadges(p) {
  const badges = [];
  if (p.rig_ord === 1) badges.push({ type: 'rig-primary', text: 'Rigorista designato' });
  else if (p.rig_ord) badges.push({ type: 'rig', text: p.rig_ord + '° rigorista' });
  if (p.piaz_ord) badges.push({ type: 'piaz', text: p.piaz_ord === 1 ? '1° piazzati' : (p.piaz_ord + '° piazzati') });
  return badges;
}

/* ---------- gestione squadre di lega ---------- */

function getMyTeam() {
  return state.teams.find(t => t.isMine) || state.teams[0];
}
function getTeam(teamId) {
  return state.teams.find(t => t.id === teamId);
}
function addTeam(name) {
  const team = { id: uid(), name: name && name.trim() ? name.trim() : ('Squadra ' + (state.teams.length + 1)), isMine: false };
  state.teams.push(team);
  saveState();
  return team;
}
function renameTeam(teamId, name) {
  const t = getTeam(teamId);
  if (t && name && name.trim()) { t.name = name.trim(); saveState(); }
}
function setMyTeam(teamId) {
  state.teams.forEach(t => t.isMine = (t.id === teamId));
  saveState();
}
function removeTeam(teamId) {
  const t = getTeam(teamId);
  if (!t || t.isMine || state.teams.length <= 1) return false;
  Object.keys(state.assignments).forEach(pid => {
    if (state.assignments[pid].teamId === teamId) delete state.assignments[pid];
  });
  state.teams = state.teams.filter(x => x.id !== teamId);
  if (state.astaTeamFilter === teamId) state.astaTeamFilter = getMyTeam().id;
  saveState();
  return true;
}

function assignPlayer(playerId, teamId, price) {
  const prev = state.assignments[playerId] ? Object.assign({}, state.assignments[playerId]) : null;
  state.assignments[playerId] = { teamId, price: Math.max(0, Math.round(price) || 0) };
  saveState();
  const p = PLAYERS_CURRENT.find(pl => String(pl.id) === String(playerId));
  lastAction = {
    label: 'Assegnato ' + (p ? p.nome : 'giocatore'),
    undo() {
      if (prev) state.assignments[playerId] = prev; else delete state.assignments[playerId];
      saveState();
    },
  };
  refreshTeamPanel();
}
function unassignPlayer(playerId) {
  const prev = state.assignments[playerId] ? Object.assign({}, state.assignments[playerId]) : null;
  delete state.assignments[playerId];
  saveState();
  if (prev) {
    const p = PLAYERS_CURRENT.find(pl => String(pl.id) === String(playerId));
    lastAction = {
      label: 'Liberato ' + (p ? p.nome : 'giocatore'),
      undo() { state.assignments[playerId] = prev; saveState(); },
    };
  }
  refreshTeamPanel();
}
function assignmentFor(playerId) {
  return state.assignments[String(playerId)] || state.assignments[playerId] || null;
}

function teamSpent(teamId) {
  let spent = 0;
  for (const pid in state.assignments) {
    if (state.assignments[pid].teamId === teamId) spent += state.assignments[pid].price || 0;
  }
  return spent;
}
function teamRosterCount(teamId) {
  let n = 0;
  for (const pid in state.assignments) if (state.assignments[pid].teamId === teamId) n++;
  return n;
}
function teamRoster(teamId) {
  const out = [];
  for (const pid in state.assignments) {
    const a = state.assignments[pid];
    if (a.teamId !== teamId) continue;
    const p = PLAYERS_CURRENT.find(pl => String(pl.id) === String(pid));
    if (p) out.push({ player: p, price: a.price });
  }
  return out;
}

function budgetSpent() {
  return teamSpent(getMyTeam().id);
}

function budgetByRoleSpent() {
  const out = { P: 0, D: 0, C: 0, A: 0 };
  teamRoster(getMyTeam().id).forEach(({ player, price }) => { out[player.r] = (out[player.r] || 0) + price; });
  return out;
}

   crediti personale per suggerire quanto spendere per ogni "posto" del reparto. */

/* ---------- filtering & sorting ---------- */

function filterListone() {
  let list = PLAYERS_CURRENT.filter(p => p.r === state.listoneRole);
  if (state.listoneTier !== 'all') list = list.filter(p => p.tier === state.listoneTier);
  if (state.listoneSearch.trim()) {
    const q = state.listoneSearch.trim().toLowerCase();
    list = list.filter(p => p.nome.toLowerCase().includes(q) || p.squadra.toLowerCase().includes(q));
  }
  if (state.listoneHideTaken) {
    list = list.filter(p => !assignmentFor(p.id));
  }
  if (state.listoneFavOnly) {
    list = list.filter(p => isFavorite(p.id));
  }
  const sortKey = state.listoneSort;
  list = list.slice().sort((a, b) => {
    if (sortKey === 'fvm') return b.fvm - a.fvm;
    if (sortKey === 'qta') return b.qta - a.qta;
    if (sortKey === 'fm') return (b.prev ? b.prev.fm : -1) - (a.prev ? a.prev.fm : -1);
    if (sortKey === 'pv') return (b.prev ? b.prev.pv : -1) - (a.prev ? a.prev.pv : -1);
    if (sortKey === 'gf') return (b.prev ? b.prev.gf : -1) - (a.prev ? a.prev.gf : -1);
    if (sortKey === 'ass') return (b.prev ? b.prev.ass : -1) - (a.prev ? a.prev.ass : -1);
    return b.score - a.score;
  });
  return list;
}

function seasonStatsList(season) {
  return season === '2627' ? STATS_ALL_2627 : STATS_ALL_2526;
}

function filterStats() {
  let list = seasonStatsList(state.statsSeason).slice();
  if (state.statsRole !== 'all') list = list.filter(p => p.r === state.statsRole);
  if (state.statsTeam !== 'all') list = list.filter(p => p.squadra === state.statsTeam);
  if (state.statsSearch.trim()) {
    const q = state.statsSearch.trim().toLowerCase();
    list = list.filter(p => p.nome.toLowerCase().includes(q) || p.squadra.toLowerCase().includes(q));
  }
  const sortKey = state.statsSort;
  list = list.sort((a, b) => {
    if (sortKey === 'fm') return b.fm - a.fm;
    if (sortKey === 'mv') return b.mv - a.mv;
    if (sortKey === 'pv') return b.pv - a.pv;
    if (sortKey === 'gf') return b.gf - a.gf;
    if (sortKey === 'ass') return b.ass - a.ass;
    if (sortKey === 'amm') return b.amm - a.amm;
    return b.fm - a.fm;
  });
  return list;
}

/* ---------- rendering: incremental batches for perf ---------- */

function makeIncrementalRenderer(container, items, renderItem, batchSize) {
  container.innerHTML = '';
  let idx = 0;
  function renderMore() {
    const frag = document.createDocumentFragment();
    const end = Math.min(idx + batchSize, items.length);
    for (; idx < end; idx++) frag.appendChild(renderItem(items[idx]));
    container.appendChild(frag);
  }
  renderMore();
  return renderMore;
}

function wireListoneControls() {
  viewEl().querySelectorAll('.seg-btn').forEach(btn => btn.addEventListener('click', () => {

  search.addEventListener('input', debounce(() => {

    state.listoneSort = e.target.value;

  wireScrollTopWatcher();

/* bottone "torna su" nel listone: un solo listener globale, riattaccato dopo
   ogni sostituzione del DOM del listone farebbe leak — lo registriamo una
   volta sola e leggiamo il bottone corrente ad ogni scroll. */
let listoneScrollWatcherWired = false;
function updateListoneScrollTopVisibility() {
  const btn = document.getElementById('listone-scroll-top');
  if (!btn) return;
  const appEl = document.getElementById('app');
  const y = window.scrollY || (appEl ? appEl.scrollTop : 0) || 0;
  btn.hidden = y < 400;
}
function wireScrollTopWatcher() {
  if (listoneScrollWatcherWired) return;
  listoneScrollWatcherWired = true;
  window.addEventListener('scroll', updateListoneScrollTopVisibility, { passive: true });
  const appEl = document.getElementById('app');
  if (appEl) appEl.addEventListener('scroll', updateListoneScrollTopVisibility, { passive: true });
}

function renderListoneList() {
  const container = document.getElementById('listone-list');
  const list = filterListone();
  currentRenderMore = null;
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">Nessun giocatore trovato con questi filtri.</div>`;
    return;
  }
  // un solo comportamento, qualunque sia il filtro fascia: i chip filtrano
  // la stessa struttura a sezioni, non ne cambiano la forma.
  container.innerHTML = '';
  const tiersToShow = state.listoneTier === 'all' ? TIER_ORDER : [state.listoneTier];
  tiersToShow.forEach(t => {
    const sub = list.filter(p => p.tier === t);
    if (!sub.length) return;
    const section = el('div', 'tier-section');
    section.innerHTML = `<div class="tier-head ${TIER_META[t].cls}">
      <span>${TIER_META[t].label}</span><span class="tier-count">${sub.length}</span>
    </div>
    <p class="tier-desc">${TIER_META[t].desc}</p>`;
    const listWrap = el('div', 'p-list-inner');
    sub.forEach(p => listWrap.appendChild(playerCardListone(p)));
    section.appendChild(listWrap);
    container.appendChild(section);
  });
}

function wireStatsControls() {

  viewEl().querySelectorAll('.seg-btn').forEach(btn => btn.addEventListener('click', () => {

    renderStatsList();
  }));

  search.addEventListener('input', debounce(() => {
    state.statsSearch = search.value;

    state.statsTeam = e.target.value;

function renderStatsList() {
  const container = document.getElementById('stats-list');
  const list = filterStats();
  if (!list.length) {
    container.innerHTML = `<div class="empty-state">Nessun giocatore trovato con questi filtri.</div>`;
    return;
  }
  currentRenderMore = makeIncrementalRenderer(container, list, statsCard, 40);
  attachInfiniteScroll(container);
}

/* ---------- infinite scroll ---------- */

function attachInfiniteScroll(container) {
  const onScroll = debounce(() => {
    const rect = container.getBoundingClientRect();
    if (rect.bottom < window.innerHeight + 600 && currentRenderMore) currentRenderMore();
  }, 100);
  window.addEventListener('scroll', onScroll);
}

/* ---------- utils ---------- */

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}
/* =========================================================
   Team picker — bottom sheet per assegnare un giocatore
   a una delle squadre della lega (la tua o un'avversaria).
   ========================================================= */

function closeSheet() {
  const existing = document.getElementById('team-sheet-backdrop');
  if (existing) existing.remove();
}

/* foglio di conferma in-app — sostituisce window.confirm() per restare nel linguaggio grafico dell'app */
function openConfirmSheet({ title, text, confirmLabel, onConfirm }) {
  closeSheet();
  const backdrop = el('div', 'sheet-backdrop');
  backdrop.id = 'team-sheet-backdrop';
  backdrop.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">${title}</div>
      <div class="confirm-sheet-text">${text}</div>
      <div class="confirm-sheet-actions">
        <button class="sheet-cancel-btn" id="confirm-cancel" type="button" style="flex:1">Annulla</button>
        <button class="confirm-sheet-danger" id="confirm-ok" type="button">${confirmLabel}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) closeSheet(); });
  document.getElementById('confirm-cancel').addEventListener('click', closeSheet);
  document.getElementById('confirm-ok').addEventListener('click', () => { closeSheet(); onConfirm(); });
}

function openTeamPicker(player, onDone) {
  closeSheet();
  const current = assignmentFor(player.id);
  const myTeam = getMyTeam();
  const ordered = [myTeam, ...state.teams.filter(t => t.id !== myTeam.id)];

  const backdrop = el('div', 'sheet-backdrop');
  backdrop.id = 'team-sheet-backdrop';
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', (ev) => { if (ev.target === backdrop) closeSheet(); });

  function renderTeamStep() {
    const teamRows = ordered.map(t => {
      const spent = teamSpent(t.id);
      const remaining = state.budgetTotal - spent;
      const isCurrent = current && current.teamId === t.id;
      return `
        <button class="sheet-team-btn ${t.isMine ? 'is-mine' : ''} ${isCurrent ? 'is-current' : ''}" data-team-id="${t.id}">
          <span class="sheet-team-name">${t.isMine ? '★ ' : ''}${escapeAttr(t.name)}</span>
          <span class="sheet-team-budget">${remaining} cr. rimasti${isCurrent ? ' · attuale' : ''}</span>
        </button>`;
    }).join('');

    backdrop.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Assegna <b>${escapeAttr(player.nome)}</b></div>
        <div class="sheet-sub">${escapeAttr(player.squadra)} · FVM ${fmt0(fvmForBudget(player.fvm))} · Qt.A ${fmt0(player.qta)}</div>
        <div class="sheet-teams">${teamRows}</div>
        ${current ? `<button class="sheet-free-btn" id="sheet-free-btn">Libera giocatore</button>` : ''}
        <button class="sheet-cancel-btn" id="sheet-cancel-btn">Annulla</button>
      </div>
    `;

    document.getElementById('sheet-cancel-btn').addEventListener('click', closeSheet);
    const freeBtn = document.getElementById('sheet-free-btn');
    if (freeBtn) freeBtn.addEventListener('click', () => {
      unassignPlayer(player.id);
      closeSheet();
      if (onDone) onDone();
    });
    backdrop.querySelectorAll('.sheet-team-btn').forEach(btn => {
      btn.addEventListener('click', () => renderPriceStep(btn.dataset.teamId));
    });
  }

  /* stepper prezzo con termometro del mercato — sostituisce window.prompt() */
  function renderPriceStep(teamId) {
    const team = getTeam(teamId);
    const suggested = current && current.teamId === teamId ? current.price : Math.max(1, Math.round(player.qta));
    const remaining = state.budgetTotal - teamSpent(team.id);

    backdrop.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">Assegna <b>${escapeAttr(player.nome)}</b> a ${escapeAttr(team.name)}</div>
        <div class="price-step-info">
          <div class="price-info-chip">
            <span class="price-info-cap">Quotazione base</span>
            <span class="price-info-val">${fmt0(player.qta)} cr.</span>
          </div>
          <div class="price-info-chip${remaining < suggested ? ' is-warn' : ''}">
            <span class="price-info-cap">Budget rimasto a ${escapeAttr(team.name)}</span>
            <span class="price-info-val">${remaining} cr.</span>
          </div>
        </div>
        <div class="price-step">
          <div class="price-step-row">
            <button class="price-step-btn" id="price-minus" type="button" aria-label="Un credito in meno">−</button>
            <input class="price-step-input" id="price-input" type="number" inputmode="numeric" min="0" value="${suggested}">
            <button class="price-step-btn" id="price-plus" type="button" aria-label="Un credito in più">+</button>
          </div>
          <div class="price-therm-wrap"><span class="price-therm" id="price-therm"></span></div>
        </div>
        <div class="price-step-actions">
          <button class="sheet-cancel-btn" id="price-back" type="button" style="flex:1">Indietro</button>
          <button class="price-step-confirm" id="price-confirm" type="button">Conferma</button>
        </div>
      </div>
    `;

    const input = document.getElementById('price-input');
    const therm = document.getElementById('price-therm');
    function updateTherm() {
      const v = parseInt(input.value, 10) || 0;
      const delta = v - Math.round(player.qta);
      if (delta === 0) { therm.className = 'price-therm even'; therm.textContent = 'In linea con la quotazione base'; }
      else if (delta < 0) { therm.className = 'price-therm under'; therm.textContent = delta + ' sotto quotazione — buon affare'; }
      else { therm.className = 'price-therm over'; therm.textContent = '+' + delta + ' sopra quotazione'; }
    }
    updateTherm();
    input.addEventListener('input', updateTherm);
    document.getElementById('price-minus').addEventListener('click', () => {
      input.value = Math.max(0, (parseInt(input.value, 10) || 0) - 1); updateTherm();
    });
    document.getElementById('price-plus').addEventListener('click', () => {
      input.value = (parseInt(input.value, 10) || 0) + 1; updateTherm();
    });
    document.getElementById('price-back').addEventListener('click', renderTeamStep);
    document.getElementById('price-confirm').addEventListener('click', () => {
      const v = parseInt(input.value, 10);
      assignPlayer(player.id, teamId, isNaN(v) ? 0 : v);
      closeSheet();
      if (onDone) onDone();
    });
    input.focus();
    input.select();
  }

  renderTeamStep();
}

function highlightSetpieceCell(data) {
  const raw = String(data.cell.raw || '');

// Palette PDF allineate ai 3 temi dell'app: le pagine restano carta bianca
// (jsPDF non ha uno sfondo scuro), ma la fascia colorata in alto, le
// intestazioni tabella e i colori di fascia seguono il tema attivo, così i
// PDF esportati riprendono il colpo d'occhio del tema scelto in app.
const PDF_PALETTES = {
  a: { // Notte di San Siro — identico all'originale, nessun cambiamento visivo

    headFill: [18, 51, 38], seasonFill1: [22, 59, 43], seasonFill2: [24, 68, 50], footFill: [22, 59, 43],
    accentGold: [227, 179, 65], onGold: [30, 30, 30], faint: [110, 120, 114],
    tierBuono: [58, 160, 143], tierScommessa: [207, 122, 66], tierUltime: [120, 130, 124],
  },
  b: { // Sala Stampa — fascia scura derivata da --ink su carta chiara, oro caldo
    band: [29, 42, 32], bandTitle: [201, 154, 60], bandSubtitle: [245, 241, 229],
    headFill: [40, 58, 44], seasonFill1: [46, 66, 51], seasonFill2: [53, 75, 58], footFill: [40, 58, 44],
    accentGold: [165, 117, 28], onGold: [30, 30, 30], faint: [110, 120, 114],
    tierBuono: [31, 122, 104], tierScommessa: [166, 100, 42], tierUltime: [107, 98, 72],
  },
  c: { // Diretta Neon — fascia quasi nera, oro/verde acceso
    band: [5, 12, 8], bandTitle: [255, 207, 77], bandSubtitle: [242, 255, 247],
    headFill: [12, 25, 19], seasonFill1: [16, 35, 25], seasonFill2: [20, 45, 32], footFill: [12, 25, 19],
    accentGold: [255, 207, 77], onGold: [30, 30, 30], faint: [110, 120, 114],
    tierBuono: [34, 201, 158], tierScommessa: [224, 112, 48], tierUltime: [77, 107, 91],
  },
};

function pdfPalette() {
  return PDF_PALETTES[state.theme] || PDF_PALETTES.a;
}

function pdfHeader(doc, title, subtitle) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const pal = pdfPalette();
  doc.setFillColor(pal.band[0], pal.band[1], pal.band[2]);
  doc.rect(0, 0, pageWidth, 28, 'F');
  doc.setTextColor(pal.bandTitle[0], pal.bandTitle[1], pal.bandTitle[2]);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text(title, 14, 15);
  doc.setTextColor(pal.bandSubtitle[0], pal.bandSubtitle[1], pal.bandSubtitle[2]);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9);
  doc.text(subtitle, 14, 22);
  doc.setTextColor(20, 20, 20);
}

function tierRGB(tier) {
  // allineato alla palette fasce del tema attivo: coerenza schermo/PDF.
  const pal = pdfPalette();
  switch (tier) {
    case 'top': return pal.accentGold;
    case 'buono': return pal.tierBuono;
    case 'scommessa': return pal.tierScommessa;
    case 'ultime': return pal.tierUltime;
    default: return [200, 200, 200];
  }
}

function exportListonePDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
  let first = true;

  ['P', 'D', 'C', 'A'].forEach(role => {
    const players = PLAYERS_CURRENT.filter(p => p.r === role).sort((a, b) => {
      const ta = TIER_ORDER.indexOf(a.tier), tb = TIER_ORDER.indexOf(b.tier);
      if (ta !== tb) return ta - tb;
      return b.fvm - a.fvm;
    });
    if (!players.length) return;
    if (!first) doc.addPage();
    first = false;
    const pal = pdfPalette();
    pdfHeader(doc, 'Listone ' + ROLE_META[role].label, APP_NAME + ' — generato il ' + new Date().toLocaleDateString('it-IT') + ' — dati 2025/26 e 2026/27 tenuti ben distinti — FVM su budget ' + state.budgetTotal + ' cr.');

    const body = players.map(p => {
      const prev = p.prev;
      const curr = p.curr && p.curr.pv > 0 ? p.curr : null;
      return [
        p.nome, p.squadra, TIER_META[p.tier].short,
        fmt0(fvmForBudget(p.fvm)), fmt0(p.qta),
        prev ? fmt0(prev.pv) : '-', prev ? fmt1(prev.mv) : '-', prev ? fmt1(prev.fm) : '-',
        prev ? fmt0(prev.gf) : '-', prev ? fmt0(prev.ass) : '-',
        curr ? fmt0(curr.pv) : '-', curr ? fmt1(curr.mv) : '-', curr ? fmt1(curr.fm) : '-',
        curr ? fmt0(curr.gf) : '-', curr ? fmt0(curr.ass) : '-',
        setpieceText(p)
      ];
    });

    doc.autoTable({
      startY: 33,
      head: [
        [
          { content: 'Nome', rowSpan: 2 }, { content: 'Squadra', rowSpan: 2 }, { content: 'Fascia', rowSpan: 2 },
          { content: 'FVM', rowSpan: 2 }, { content: 'Qt.A', rowSpan: 2 },
          { content: 'Stagione 2025/26 (annata completa)', colSpan: 5, styles: { halign: 'center', fillColor: pal.seasonFill1 } },
          { content: 'Stagione 2026/27 (in corso, ' + META.max_pv_2627 + 'ᵃ giornata)', colSpan: 5, styles: { halign: 'center', fillColor: pal.seasonFill2 } },
          { content: 'Palla ferma', rowSpan: 2 },
        ],
        ['PG', 'MV', 'FM', 'Gol', 'Ass', 'PG', 'MV', 'FM', 'Gol', 'Ass'],
      ],
      body,
      styles: { fontSize: 7.2, cellPadding: 1.3 },
      headStyles: { fillColor: pal.headFill, textColor: pal.bandSubtitle },
      didParseCell: (data) => {
        if (data.section !== 'body') return;
        if (data.column.index === 2) {
          const tierKey = Object.keys(TIER_META).find(k => TIER_META[k].short === data.cell.raw);
          if (tierKey) {
            const rgb = tierRGB(tierKey);
            data.cell.styles.fillColor = rgb;
            data.cell.styles.textColor = tierKey === 'scommessa' || tierKey === 'top' ? [30,30,30] : [255,255,255];
            data.cell.styles.fontStyle = 'bold';
          }
        }
        // colonne 10-14 = stagione 26/27 in corso: leggero tint per separarle a colpo d'occhio
        if (data.column.index >= 10 && data.column.index <= 14) {
          data.cell.styles.fillColor = data.cell.styles.fillColor || [234, 244, 238];
        }
        if (data.column.index === 15) highlightSetpieceCell(data);
      },
      margin: { top: 33 },
    });
  });

  doc.save(PDF_PREFIX + '_Listone.pdf');
}

function exportRosaPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const ordered = [getMyTeam(), ...state.teams.filter(t => !t.isMine)];

  ordered.forEach((team, idx) => {
    if (idx > 0) doc.addPage();
    const pal = pdfPalette();
    pdfHeader(doc, (team.isMine ? '★ ' : '') + team.name, APP_NAME + ' — generato il ' + new Date().toLocaleDateString('it-IT'));

    const roster = teamRoster(team.id);
    const spent = teamSpent(team.id);
    const overall = overallRosaScore(team.id);

    doc.setFontSize(10);
    doc.setTextColor(20,20,20);
    doc.text('Budget totale: ' + state.budgetTotal + ' crediti  —  Spesi: ' + spent + '  —  Rimasti: ' + (state.budgetTotal - spent), 14, 33);

    const body = ['P','D','C','A'].flatMap(r => roster.filter(x => x.player.r === r)).map(({ player: p, price }) => {
      const prev = p.prev;
      const curr = p.curr && p.curr.pv > 0 ? p.curr : null;
      return [
        ROLE_META[p.r].short, p.nome, p.squadra, price, fmt0(fvmForBudget(p.fvm)),
        prev ? fmt1(prev.fm) : '-', curr ? fmt1(curr.fm) : '-',
        setpieceText(p)
      ];
    });

    if (!body.length) {
      doc.text('Nessun giocatore assegnato a questa squadra.', 14, 45);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.setTextColor(pal.accentGold[0], pal.accentGold[1], pal.accentGold[2]);
      doc.text('Overall Rosa: ' + overall + ' / 100', 14, 55);
      doc.setTextColor(20, 20, 20);
      doc.setFont('helvetica', 'normal');
    } else {
      // riga Totale: somma crediti/FVM, media delle fantamedie disponibili per stagione
      const totalPrice = roster.reduce((s, x) => s + x.price, 0);
      const totalFVM = roster.reduce((s, x) => s + fvmForBudget(x.player.fvm), 0);
      const fmPrevVals = roster.map(x => x.player.prev).filter(Boolean).map(p => p.fm);
      const fmCurrVals = roster.map(x => x.player.curr).filter(p => p && p.pv > 0).map(p => p.fm);
      const avgFmPrev = fmPrevVals.length ? fmPrevVals.reduce((a, b) => a + b, 0) / fmPrevVals.length : null;
      const avgFmCurr = fmCurrVals.length ? fmCurrVals.reduce((a, b) => a + b, 0) / fmCurrVals.length : null;

      doc.autoTable({
        startY: 40,
        head: [['R', 'Nome', 'Squadra', 'Prezzo pagato', 'FVM', 'FM 25/26', 'FM 26/27', 'Palla ferma']],
        body,
        foot: [['', 'Totale', '', totalPrice, fmt0(totalFVM), avgFmPrev != null ? fmt1(avgFmPrev) + ' (media)' : '-', avgFmCurr != null ? fmt1(avgFmCurr) + ' (media)' : '-', '']],
        styles: { fontSize: 9, cellPadding: 2 },
        headStyles: { fillColor: pal.headFill, textColor: pal.bandSubtitle },
        footStyles: { fillColor: pal.footFill, textColor: pal.accentGold, fontStyle: 'bold' },
        didParseCell: (data) => {
          if (data.section === 'body' && data.column.index === 7) highlightSetpieceCell(data);
        },
      });

      const afterY = doc.lastAutoTable.finalY + 10;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(13);
      doc.setTextColor(pal.accentGold[0], pal.accentGold[1], pal.accentGold[2]);
      doc.text('Overall Rosa: ' + overall + ' / 100', 14, afterY);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(110, 120, 114);
      doc.text('Qualità media per reparto (FVM) rispetto al miglior FVM del listone in quel ruolo, pesata P 6% / D 20% / C 32% / A 42%.', 14, afterY + 5);
      doc.setTextColor(20, 20, 20);
    }
  });
  doc.save(PDF_PREFIX + '_LaTuaRosa.pdf');
}
